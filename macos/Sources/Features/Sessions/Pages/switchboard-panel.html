<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session banner</title>
<style>
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --sunk:#EFEEEA; --line:#E2E1DC; --line2:#D2D1CB;
  --ink:#17171A; --ink2:#3A3A42; --muted:#5A5A62; --faint:#A0A0A7;
  --accent:#2D5BE3; --accent-soft:#E7EDFD; --sel:#3B5BDB;
  --needs:#C25A12; --needs-soft:#FCEFE4; --work:#2D5BE3; --done:#1E7A4C;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16161A; --surface:#1E1E23; --sunk:#26262C; --line:#2C2C33; --line2:#3A3A42;
    --ink:#EDEDF0; --ink2:#C9C9CF; --muted:#A3A3AA; --faint:#606068;
    --accent:#7FA2FF; --accent-soft:#232B45; --sel:#3B5BDB;
    --needs:#F2A15C; --needs-soft:#3A2618; --work:#7FA2FF; --done:#5BC98E;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:default}
/* The panel has one fixed height (the app uses the same number), so nothing
   above the terminal ever jumps: every row is always there, empty or not. */
#wrap{display:flex;flex-direction:column;height:158px;overflow:hidden}
#banner{display:flex;flex-direction:column;gap:3px;height:128px;flex:none;padding:8px 12px;border-bottom:1px solid var(--line);overflow:hidden}
#banner.needs{border-bottom:2px solid var(--needs)}
.r0{display:flex;align-items:center;gap:6px;min-width:0;height:19px;overflow:hidden}
.r0 .dir,.r0 .chip{height:19px}
.r1{display:flex;align-items:center;gap:8px;min-width:0;height:22px}
.none{color:var(--muted);font-size:12.5px}
.name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.login{position:relative}
.login > button{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);background:var(--sunk);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.login > button:hover{border-color:var(--accent)}
.upd{font-size:11.5px;color:var(--muted);white-space:nowrap}
/* The folder the session works in (and its branch, when it is not master). */
.dir{display:inline-flex;align-items:center;gap:4px;min-width:0;flex:0 2 auto;max-width:320px;font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;background:var(--surface)}
.dir span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dir .br{color:var(--muted);flex:0 2 auto}
.dir .mv{flex:0 0 auto}
/* Where it runs and what it works on: machine › folder, model, work tree, its changes, its dev server. */
.where{flex:0 3 auto}
.where .sep{color:var(--faint);flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;min-width:0;flex:0 1 auto;font-size:11.5px;font-weight:600;color:var(--ink2);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;background:var(--surface);white-space:nowrap;height:20px}
.chip span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.md{flex:none;color:var(--muted)}
.chip.wt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;flex:0 4 auto;max-width:340px}
.chip.diff{flex:none;font-variant-numeric:tabular-nums}
.chip.diff .add{color:var(--done)}
.chip.diff .del{color:#C8362E}
@media (prefers-color-scheme: dark){ .chip.diff .del{color:#FF7B72} }
.chip.diff.none{color:var(--muted);font-weight:500}
button.chip.srv{flex:none}
button.chip.srv:hover{border-color:var(--accent);color:var(--ink)}
.r1 .upd{flex:0 100 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.r1 .name{flex:0 1 auto;min-width:40px}
.r1 .acct{flex-shrink:0}
.r2,.r3{display:flex;gap:6px;align-items:center;min-width:0;height:18px}
.r2 .k{font-weight:700;font-size:12.5px;white-space:nowrap}
.r2 .v{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.r3 .k{font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.r3 .v{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.r3 .you{color:var(--needs);font-weight:700}
.r3 .sep{color:var(--faint);padding:0 6px;font-weight:700}
.muted{color:var(--muted)}
/* Links the session gave you: dev pages on the left (Chrome), Docs and artifacts on the right (Arc). */
.r4{display:flex;align-items:center;gap:5px;min-width:0;height:22px;overflow:hidden}
.lgrp{display:flex;align-items:center;gap:5px;flex:none}
.lgrp.pub{margin-left:auto}
.lnk{display:inline-flex;align-items:center;gap:5px;max-width:210px;flex:none;border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:1px 7px;font-size:11.5px;color:var(--ink2);height:20px}
.lnk:hover,.more:hover{border-color:var(--accent);color:var(--ink)}
.lnk .lt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lnk .lp,.lnk .lo{color:var(--muted);font-size:10.5px;white-space:nowrap}
.lnk .lo{border-left:1px solid var(--line2);padding-left:5px}
.more{flex:none;border:1px solid var(--line2);background:var(--sunk);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;color:var(--ink2);height:20px}
.replies{display:inline-flex;gap:5px;flex:none}
.reply{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:600}
.reply:hover{border-color:var(--accent)}
#tabs{display:flex;overflow:hidden;align-items:center;gap:2px;height:30px;flex:none;padding:0 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.updbtn{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:0;border-radius:6px;padding:2px 9px;background:var(--sel);color:#fff;font-size:11.5px;font-weight:700;white-space:nowrap}
.tab{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:6px;padding:3px 8px;font-size:12px;color:var(--muted);max-width:220px;min-width:56px;flex:0 1 auto}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:var(--sunk)}
.tab[aria-selected=true]{background:var(--sunk);color:var(--ink);font-weight:600}
.tab .x{opacity:0;font-size:11px;color:var(--faint)}
.tab:hover .x{opacity:1}
.addtab{flex:none;border:0;background:transparent;color:var(--muted);font-size:15px;padding:0 8px;border-radius:6px}
.addtab:hover{background:var(--sunk)}
.right{flex:none;margin-left:auto;display:flex;align-items:center;gap:6px}
.right .updbtn{margin-left:0}
.donebtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:2px 9px;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.donebtn:hover{border-color:var(--accent);color:var(--ink)}
.pinned{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
svg{flex-shrink:0}
.acct{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.use{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.use .g{display:flex;align-items:center;gap:5px}
.use .meter{width:70px;height:7px;border-radius:4px;background:var(--sunk);border:1px solid var(--line2);overflow:hidden}
.use .meter i{display:block;height:100%;background:var(--accent)}
.use .meter.hi i{background:var(--needs)}
.use b{color:var(--ink);font-weight:700}
.use .spark{color:var(--accent)}
</style>
</head>
<body>
<div id="wrap">
  <div id="banner"></div>
  <div id="tabs"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bridge = (type, d={}) => { try { window.webkit.messageHandlers.sessions.postMessage({type, page:'banner', ...d}); } catch {} };
const ICON = {
  laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10"/><path d="M18 9c0 5-12 3-12 8"/>',
  play:'<path d="M7 5v14l11-7z"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  q:'<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4"/><path d="M12 17h.01"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  warn:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  hand:'<path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  spin:'<path d="M21 12a9 9 0 1 1-6.2-8.56"/>', check:'<polyline points="20 6 9 17 4 12"/>',
  dots:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  chev:'<polyline points="6 9 12 15 18 9"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/>',
  doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/>',
  pin:'<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16v4"/><path d="M17 18h4"/>', term:'<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>', down:'<path d="M12 5v14"/><polyline points="19 12 12 19 5 12"/>',
};
const ic = (n, s=12, w=2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const LOOK = {
  urgent:['warn','Urgent','--needs'], permission:['hand','Approve','--needs'], question:['q','Answer','--needs'],
  review:['eye','Look at it','--needs'], heads_up:['warn','Read this','--needs'], working:['spin','Working','--work'],
  reading:['dots','Reading','--muted'], done:['check','Done','--done'], handled:['check','Handled','--done'], info:['check','Answered','--muted'],
  shell:['term','Terminal','--muted'],
};
const NEEDS = new Set(['permission','question','review','heads_up']);
const LOGINS = [['~/.claude','simplero.com','brief'],['~/.claude-ccl','corre.li','person'],['~/.claude-ccm','correli.me','star']];
const stateOf = s => (s.u && NEEDS.has(s.st)) ? 'urgent' : (s.st || 'info');
const ago = t => { if (!t) return ''; const d = Math.max(0, Date.now()/1000 - t); return d < 60 ? 'just now' : d < 3600 ? Math.round(d/60) + 'm ago' : d < 86400 ? Math.round(d/3600) + 'h ago' : Math.round(d/86400) + 'd ago'; };

let data = null;
let ctx = {surfaces: [], tabs: [], update: null};

window.Banner = { setContext(c){ ctx = c || ctx; render(); }, setData(d){ data = d; render(); } };

const until = iso => { if (!iso) return ''; const d = (Date.parse(iso) - Date.now())/1000; if (d <= 0) return 'now';
  return d < 3600 ? Math.round(d/60) + 'm' : d < 86400 ? Math.round(d/3600) + 'h' : Math.round(d/86400) + 'd'; };
// Plan usage of this session's login: the 5-hour window, the week, and (once it has
// half a day of points) a graph of the weekly % over the last 7 days.
function usageHTML(s){
  const u = data && data.use && data.use[s.ld];
  if (!u || (!u.wk && !u.h5)) return '';
  const meter = (x, label, tip) => x ? `<span class="g" title="${tip}">${label} <span class="meter${x.p >= 90 ? ' hi' : ''}"><i style="width:${Math.min(100, x.p)}%"></i></span> <b>${x.p}%</b> <span>resets in ${until(x.r)}</span></span>` : '';
  const h = (u.hist || []).filter(x => x[1] != null);
  let spark = '';
  if (h.length > 1 && h[h.length - 1][0] - h[0][0] >= 12 * 3600){
    const now = Date.now()/1000, t0 = Math.max(now - 7*86400, h[0][0]), span = Math.max(1, now - t0), W = 84, H = 18;
    const pts = h.filter(x => x[0] >= t0).map(x => `${((x[0] - t0) / span * W).toFixed(1)},${(H - 1 - x[1] / 100 * (H - 2)).toFixed(1)}`).join(' ');
    const lbl = `Weekly usage over the last ${span >= 86400 * 1.5 ? Math.round(span / 86400) + ' days' : Math.round(span / 3600) + ' hours'}`;
    spark = `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="${lbl}"><title>${lbl}</title><rect x="0" y="0" width="${W}" height="${H}" rx="3" fill="var(--sunk)"/><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  }
  return `<span class="use">${meter(u.h5, '5h', 'Usage in the current 5-hour window')}${meter(u.wk, 'Week', 'Usage this week')}${spark}</span>`;
}

// Links: [kind, url, title, login]. Dev pages open in Chrome; Docs next to the session (a pane
// on the right); artifacts in Arc (in the Space of the login that published them).
const LINK = {dev: ['globe', 'Opens in Chrome'], doc: ['doc', 'Opens next to this session'], artifact: ['spark', 'Opens in Arc']};
function linkHTML(l){
  const [kind, url, title, login] = l, look = LINK[kind] || LINK.dev;
  let port = '';
  if (kind === 'dev'){ try { const p = new URL(url).port; if (p) port = `<span class="lp">:${esc(p)}</span>`; } catch {} }
  const tip = `${title}\n${url}\n${look[1]}${kind === 'artifact' && login ? ` (${login})` : ''}`;
  return `<button class="lnk" data-url="${esc(url)}" title="${esc(tip)}">${ic(look[0],11,2.2)}<span class="lt">${esc(title)}</span>${port}${kind === 'artifact' && login ? `<span class="lo">${esc(login)}</span>` : ''}</button>`;
}
let shownLinks = [];
function linksHTML(s){
  const lk = s.lk || [];
  shownLinks = lk;
  if (!lk.length) return '';
  const dev = lk.filter(l => l[0] === 'dev').slice(0, 6), pub = lk.filter(l => l[0] !== 'dev').slice(0, 6);
  return `<span class="lgrp dev">${dev.map(linkHTML).join('')}</span>`
    + `<span class="lgrp pub">${pub.map(linkHTML).join('')}<button class="more" data-act="links" title="All links of this session" hidden></button></span>`;
}
// Hide the oldest links that do not fit (each list is newest first) and count them in "+N".
function fitLinks(){
  const row = document.querySelector('.r4'), more = row && row.querySelector('.more');
  if (!more) return;
  const dev = [...row.querySelectorAll('.dev .lnk')], pub = [...row.querySelectorAll('.pub .lnk')];
  [...dev, ...pub].forEach(c => c.hidden = false);
  let hidden = shownLinks.length - dev.length - pub.length;
  const show = () => { more.hidden = hidden <= 0; more.textContent = `+${hidden}`; };
  show();
  while (row.scrollWidth > row.clientWidth + 1 && (dev.length || pub.length)){
    (dev.length > pub.length || !pub.length ? dev : pub).pop().hidden = true;
    hidden++;
    show();
  }
}
window.addEventListener('resize', fitLinks);

// "calvin@host: /tmp" → "/tmp": the user and host say nothing here.
const tabTitle = t => String(t || 'Terminal').replace(/^[^@\s]+@[^:\s]+:\s*/, '') || 'Terminal';

// The folder the session works in, and its branch when it is not master.
function dirHTML(s){
  if (!s.cwd) return '';
  const br = s.br && s.br !== 'master' && s.br !== 'main' ? s.br : '';
  const mv = s.mv ? `\nMoves to ${esc(s.mv)} when its turn is over and you are not looking at it. Right-click it in the sidebar › Move to folder to move it now or keep it here.` : '';
  // On another machine (a Linux box): its name before the folder there, with a server icon.
  const on = s.m ? `Runs on ${esc(s.m)}. You see and type in it here.\nFolder on ${esc(s.m)}: ` : 'Folder: ';
  return `<span class="dir" title="${on}${esc(s.cwd)}${br ? '\nBranch: ' + esc(br) : ''}${mv}">${ic(s.m ? 'server' : 'folder',10,2.2)}<span>${s.m ? esc(s.m) + ':' : ''}${esc(s.cwd)}</span>${s.mv ? `<span class="mv">→ ${esc(s.mv)}</span>` : ''}${br ? `<span class="br">⎇ ${esc(br)}</span>` : ''}</span>`;
}

// Where it runs (the machine, then the folder there), the model, the work tree with its
// changes (as GitHub counts them: + added lines, − removed lines), and its dev server.
function placeHTML(s){
  const mach = s.m || 'This Mac';
  const where = `<span class="dir where" title="Runs on ${esc(mach)}.\nFolder: ${esc(s.cwd || '~')}${s.mv ? `\nMoves to ${esc(s.mv)} when its turn is over and you are not looking at it.` : ''}">${ic(s.m ? 'server' : 'laptop',10,2.2)}<span>${esc(mach)}</span><span class="sep">›</span>${ic('folder',10,2.2)}<span>${esc(s.cwd || '~')}</span>${s.mv ? `<span class="mv">→ ${esc(s.mv)}</span>` : ''}</span>`;
  const md = s.md ? `<span class="chip md" title="The model of its last answer">${ic('spark',10,2.2)}<span>${esc(s.md)}</span></span>` : '';
  const w = s.wt;
  let wt = '', diff = '', srv = '';
  if (w){
    const other = w.top !== s.cwd;   // it works in another work tree (a slot) than its folder
    const where2 = other ? esc(w.top.split('/').pop()) + ' · ' : '';
    wt = `<span class="chip wt" title="Work tree: ${esc(w.top)}\nBranch: ${esc(w.br)}">${ic('branch',10,2.2)}<span>${where2}${esc(w.br)}</span></span>`;
    const n = x => Number(x || 0).toLocaleString('en-US');
    if (w.sh) diff = `<span class="chip diff none" title="The main checkout: its uncommitted changes are every session's, so they are not counted here.">shared checkout</span>`;
    else if (!w.f) diff = `<span class="chip diff none" title="No changes against where this branch left the main branch.">no changes</span>`;
    else diff = `<span class="chip diff" title="${n(w.f)} files changed against where this branch left the main branch, with uncommitted and new files (looked at once a minute).">${n(w.f)} ${w.f === 1 ? 'file' : 'files'} <span class="add">+${n(w.a)}</span> <span class="del">−${n(w.d)}</span></span>`;
    if (w.sv) srv = `<button class="chip srv" data-url="${esc(w.sv.u)}" title="${w.sv.up ? 'Its dev server runs' : 'Its dev server is not running; it starts when you open it (about a minute)'}: ${esc(w.sv.u)}">${ic(w.sv.up ? 'play' : 'moon',10,2.2)}<span>${esc(w.sv.l)}</span></button>`;
  }
  return where + md + wt + diff + srv;
}

function render(){
  // The session of this window: the first Claude session in any of its tabs, so a
  // new tab (a shell, a server) keeps the same panel above it.
  const surfaces = ctx.surfaces || [];
  let s = null;
  // An agent row wins over a shell row of the same session.
  if (data){ const rows = surfaces.map(id => data.s.find(x => x.o && x.sf === id)).filter(Boolean); s = rows.find(x => x.a !== 'shell') || rows[0] || null; }
  const b = $('#banner');
  if (!s){
    b.className = '';
    b.innerHTML = `<div class="r0"></div><div class="r1"><span class="none">No session in this window.</span></div><div class="r2"></div><div class="r3"></div><div class="r4"></div>`;
  } else if (s.a === 'shell'){
    // A plain shell session (⌘N): no agent, no login, no usage.
    b.className = '';
    b.innerHTML = `
      <div class="r0">${placeHTML(s)}</div>
      <div class="r1"><span class="name">${esc(s.n)}</span>
        <span class="badge" style="color:var(--muted);background:color-mix(in srgb, var(--muted) 15%, transparent)">${ic('term',11,2.4)} Terminal</span></div>
      <div class="r2"><span class="k" style="color:var(--muted)">Folder:</span><span class="v">${esc(s.cwd)}</span></div>
      <div class="r3">${s.ns ? `<span class="k" style="font-weight:600">Running:</span><span class="v" title="${esc(s.ns)}">${esc(s.ns)}</span>` : ''}</div>
      <div class="r4"></div>`;
  } else {
    const st = stateOf(s), L = LOOK[st] || LOOK.info, needs = st === 'urgent' || NEEDS.has(st);
    const step = st === 'working' ? (s.wl || 'Working…') : (s.ns || 'Nothing needs you here.');
    const reps = (s.rp || []).filter(r => r && r[1]).slice(0, 3);
    const login = LOGINS.find(l => l[0] === s.ld) || [s.ld, s.lg, 'person'];
    b.className = needs ? 'needs' : '';
    // Row 2: what needs you, else what the session works on (a model reads the conversation).
    const row2 = needs
      ? `<span class="k" style="color:var(${L[2]})">Needs you:</span>
         <span class="v" title="${esc(step)}">${esc(step)}</span>
         ${reps.length ? `<span class="replies">${reps.map(r => `<button class="reply" data-send="${esc(r[1])}" data-k="${esc(s.k)}">${esc(r[0])}</button>`).join('')}</span>` : ''}`
      : s.gl ? `<span class="k" style="color:var(--muted)">Working on:</span><span class="v" title="${esc(s.gl)}">${esc(s.gl)}</span>`
      : `<span class="k" style="color:var(--muted)">Working on:</span><span class="v muted">${s.bp ? 'Reading the conversation…' : esc(s.t || '')}</span>`;
    // Row 3: what was raised and is not finished. "You:" = waits for you.
    const op = s.op || [];
    const row3 = op.length
      ? `<span class="k">Still open:</span><span class="v" title="${esc(op.map(([w, t]) => '• ' + (w === 'you' ? 'You: ' : '') + t).join('\n'))}">${op.map(([w, t]) => (w === 'you' ? '<span class="you">You:</span> ' : '') + esc(t)).join('<span class="sep">·</span>')}</span>`
      : s.gl ? `<span class="k">Still open:</span><span class="v muted">Nothing.</span>` : '';
    b.innerHTML = `
      <div class="r0">${placeHTML(s)}</div>
      <div class="r1">
        <span class="name">${esc(s.n)}</span>
        <span class="badge" style="color:var(${L[2]});background:color-mix(in srgb, var(${L[2]}) 15%, transparent)">${ic(L[0],11,2.4)} ${L[1]}</span>
        <span class="upd">updated ${ago(s.la)}</span>
        <span class="acct">
          <span class="login"><button data-act="login" data-k="${esc(s.k)}" data-ld="${esc(s.ld)}" title="Switch this session to another login">${ic(login[2],10,2.2)} ${esc(login[1])} ${ic('chev',9,2.6)}</button></span>
          ${usageHTML(s)}
        </span>
      </div>
      <div class="r2">${row2}</div>
      <div class="r3">${row3}</div>
      <div class="r4">${linksHTML(s)}</div>`;
  }

  // Tabs of this window, always shown (also one), with + and the update button.
  const tabs = (ctx.tabs && ctx.tabs.length) ? ctx.tabs : [{id: 0, title: 'Terminal', selected: true}];
  // From b24 the restart button is in the title bar; older builds only have this one.
  const u = ctx.update && ctx.update.running < 24 ? ctx.update : null;
  // A pin stays (Chief of staff, lazygit): no Done. Unpin it first (right-click it in the sidebar).
  const done = s && s.pn != null ? `<span class="pinned" title="Pinned: it stays in the Pinned row at the top of the sidebar. Right-click it there to unpin it.">${ic('pin',11,2.4)} Pinned</span>`
    : s ? `<button class="donebtn" data-act="done" data-k="${esc(s.k)}" title="${s.a === 'shell' ? 'Close this window and its tabs.' : 'We are done with it: close this session (Claude and every tab in this window) and move it to the Archive. It is under Archive in the sidebar; click it there to resume it.'}">${ic('check',11,2.6)} ${s.a === 'shell' ? 'Close' : 'Archive'}</button>` : '';
  $('#tabs').innerHTML = tabs.map(x => `<button class="tab" data-tab="${x.id}" aria-selected="${!!x.selected}"><span>${esc(tabTitle(x.title))}</span>${tabs.length > 1 ? `<span class="x" data-close="${x.id}" title="Close tab">✕</span>` : ''}</button>`).join('')
    + `<button class="addtab" data-act="newtab" title="New tab in this window (⌘T)">+</button>`
    + `<span class="right">${u ? `<button class="updbtn" data-act="restart" title="Switchboard b${u.installed} is installed. You run b${u.running}.">${ic('down',11,2.6)} Restart to update to b${u.installed}</button>` : ''}${done}</span>`;

  fitLinks();
  reportHeight();
}

// Builds up to b17 size the panel from this report; from b18 the app uses the
// same fixed height and ignores it.
let lastH = -1;
function reportHeight(){ if (lastH !== 136){ lastH = 136; bridge('height', {h: 136}); } }

document.addEventListener('click', async e => {
  const t = e.target;
  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'restart'){ bridge('restartUpdate'); return; }
  if (act === 'links'){
    const r = t.closest('[data-act]').getBoundingClientRect();
    bridge('linksMenu', {links: shownLinks, x: r.left, y: r.bottom + 4});
    return;
  }
  const lnk = t.closest('[data-url]'); if (lnk){ bridge('openLink', {url: lnk.dataset.url}); return; }
  if (act === 'newtab'){ bridge('newTab'); return; }
  if (act === 'done'){ bridge('op', {o: {op: 'done', k: t.closest('[data-act]').dataset.k}}); return; }
  if (act === 'login'){
    const btn = t.closest('[data-act]'), r = btn.getBoundingClientRect();
    bridge('loginMenu', {k: btn.dataset.k, ld: btn.dataset.ld, x: r.left, y: r.bottom + 4});
    return;
  }
  const cl = t.closest('[data-close]'); if (cl){ e.stopPropagation(); bridge('closeTab', {id: +cl.dataset.close}); return; }
  const tab = t.closest('[data-tab]'); if (tab){ bridge('selectTab', {id: +tab.dataset.tab}); return; }
  const send = t.closest('[data-send]'); if (send){ bridge('op', {o: {op:'send', k: send.dataset.k, text: send.dataset.send}}); return; }
});

setInterval(render, 30000);
render();
bridge('ready');
</script>
</body>
</html>
