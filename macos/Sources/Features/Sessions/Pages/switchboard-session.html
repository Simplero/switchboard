<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>In this session</title>
<link rel="stylesheet" href="switchboard-tools.css">
<style>
html,body{margin:0;min-height:100%;background:var(--bg)}
.sess{padding-bottom:28px}
.chip{cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{filter:brightness(1.15)}
.topic{position:relative}
.topic .card__tab span:first-child{overflow:hidden;text-overflow:ellipsis}
.step--fail{color:var(--needs)}
.step--fail i{background:var(--needs);color:var(--surface)}
.step--fail i::before{content:"✗"}
.now{font-size:14px;line-height:1.4;color:var(--ink2)}
.now b{color:var(--ink)}
.check{display:flex;flex-direction:column;gap:8px;border-radius:9px;padding:10px 12px;background:color-mix(in srgb,var(--needs) 10%,var(--surface));box-shadow:0 0 0 2px var(--needs)}
.check .t{font-size:15px;font-weight:800;line-height:1.3}
.empty{font-size:13px;color:var(--muted);line-height:1.45}
details.links summary{cursor:pointer;list-style:none}
details.links summary::-webkit-details-marker{display:none}
.linklist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.linklist a{font-size:12.5px;color:var(--ink2);text-decoration:none;display:flex;gap:6px;align-items:center;min-width:0;cursor:pointer}
.linklist a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linklist a:hover{color:var(--ink)}
.linklist small{color:var(--faint);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;flex:none;width:52px}
.btn{cursor:pointer}
.reading{font-size:12px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:8px}
.status{font-size:12.5px;color:var(--ink2);line-height:1.4}
.topic--done .card__tab .nm,.topic--done .status{color:var(--muted)}
/* Ask: types "About “…”: " into the session's prompt, and you finish the question there. */
.ask{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:1px solid var(--line2);border-radius:6px;background:transparent;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.ask:hover{color:var(--ink);border-color:var(--accent)}
.ask svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.check .head{display:flex;align-items:flex-start;gap:8px}
</style></head>
<body><div class="sess" id="app"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bridge = (type, d = {}) => { try { window.webkit.messageHandlers.sessions.postMessage({type, ...d}) } catch (e) {} };
const I = {
  doc: '<svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7zM14 3v4h4"/></svg>',
  pr: '<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-4"/></svg>',
  ask: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  web: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
};
const NEEDS = new Set(['permission', 'question', 'review', 'heads_up']);
let rows = [], front = '', pinnedK = null;

window.SB = {
  setData(p, extra){
    rows = (p && p.s) || [];
    front = (extra && extra.front) || '';
    render();
  }
};

function stateOf(r){
  if (!r.o) return ['off', '⏾ Off'];
  if (r.st === 'working') return ['work', '↻ Working'];
  if (r.u || NEEDS.has(r.st)) return ['needs', '? Needs you'];
  return ['done', '✓ Answered'];
}
function linkLabel(r, u){
  const l = (r.lk || []).find(x => x[1] === u);
  if (l && l[2]) return [l[0] === 'doc' ? 'doc' : 'web', l[2]];
  const m = u.match(/\/pull\/(\d+)/);
  if (m) return ['pr', 'PR #' + m[1]];
  if (/doc\.simplero\.me|\/admin\/docs/.test(u)) return ['doc', 'Doc'];
  try { const x = new URL(u); return ['web', (x.host.split('.')[0] + x.pathname).replace(/\/$/, '').slice(0, 40)]; } catch (e) { return ['web', u.slice(0, 40)]; }
}
// Only while the session runs: the words go into its terminal.
const ask = (r, what) => r.o ? `<button class="ask" data-ask="${esc('About “' + what + '”: ')}" title="Types “About ${esc(what)}:” into the session. You add your question.">${I.ask}Ask</button>` : '';
const chip = (r, u, quiet) => { const [k, t] = linkLabel(r, u); return `<span class="chip ${quiet ? 'chip--quiet' : ''}" data-link="${esc(u)}" title="${esc(u)}">${I[k]}${esc(t)}</span>`; };

// The steps of a topic's pull request: PR › CI › your check › merged. (Simplero's deploys are
// not on GitHub, so "deployed" is only what the session itself says.)
function prOf(r, t, first){
  const prs = r.pr || [];
  for (const u of t.l || []) { const p = prs.find(x => x.u === u); if (p) return p; }
  // The branch's PR belongs to the piece of work going on now, unless another one links to it.
  if (!first || !prs[0]) return null;
  return (r.bt || []).some(o => (o.l || []).includes(prs[0].u)) ? null : prs[0];
}
function steps(r, pr, waitsForYou){
  if (!pr) return '';
  const merged = pr.s === 'MERGED', closed = pr.s === 'CLOSED';
  const ci = pr.ci === 'pass' ? 'step--done' : pr.ci === 'fail' ? 'step--fail' : pr.ci === 'pending' ? 'step--now' : '';
  const s = [`<span class="step step--done" data-link="${esc(pr.u)}" style="cursor:pointer" title="${esc(pr.t)}"><i></i>PR #${pr.n}</span>`];
  s.push(`<span class="step ${merged ? 'step--done' : ci}"><i></i>CI${pr.ci === 'fail' && !merged ? ' failed' : pr.ci === 'pending' && !merged ? ' running' : ''}</span>`);
  if (!merged && !closed) s.push(`<span class="step ${waitsForYou ? 'step--now' : ''}"><i></i>Your check</span>`);
  s.push(`<span class="step ${merged ? 'step--done' : ''}"><i></i>${closed ? 'Closed' : 'Merged'}</span>`);
  return `<div class="steps">${s.join('<span class="arrow">›</span>')}</div>`;
}
// One piece of work in this session: its name, its state (a sign and a word), where it stands
// in one sentence, its PR's steps while it is open, and its Doc or PR.
function topic(r, t, current){
  const pr = prOf(r, t, current);
  const merged = pr && pr.s === 'MERGED';
  const done = t.s === 'done' || merged;
  const word = merged ? '✓ Merged' : done ? '✓ Done' : t.s === 'you' ? '? Needs you' : t.s === 'later' ? '◷ Later' : '↻ Working';
  const stc = done ? 'done' : t.s === 'you' ? 'needs' : t.s === 'later' ? 'wait' : 'work';
  const links = (t.l || []).map(u => chip(r, u, done)).join('');
  return `<article class="topic ${t.s === 'you' && !done ? 'topic--needs' : ''} ${done ? 'topic--done' : ''}">
    <div class="card__tab"><span class="nm">${esc(t.t)}</span><span class="state state--${stc}">${word}</span>${ask(r, t.t)}</div>
    ${t.x ? `<div class="status">${esc(t.x)}</div>` : ''}
    ${done ? '' : steps(r, pr, t.s === 'you')}
    ${links ? `<div class="card__links">${links}</div>` : ''}
  </article>`;
}

function render(){
  const r = rows.find(x => x.o && x.sf && x.sf === front) || rows.find(x => x.k === pinnedK);
  if (!r){ render.last = null; $('#app').innerHTML = `<div class="sess__bar"><h1 class="sess__name">In this session</h1></div><p class="empty">Go to a session: this shows what it works on, what is done and what is still open.</p>`; return; }
  pinnedK = r.k;
  const [st, word] = stateOf(r);
  const topics = r.bt || [];
  let h = `<div class="sess__bar"><h1 class="sess__name">${esc(r.n)}</h1><span class="state state--${st === 'done' ? 'done' : st}">${word}</span></div>`;
  if (r.bn) h += `<div class="now"><b>Now:</b> ${esc(r.bn)}</div>`;
  else if (r.gl) h += `<div class="now"><b>Works on:</b> ${esc(r.gl)}</div>`;
  if (r.bp) h += `<div class="reading">Reading the conversation again…</div>`;
  if (r.bc && r.bc[0]) h += `<div class="check"><div class="head"><div class="t">Check: ${esc(r.bc[0])}</div>${ask(r, 'Check: ' + r.bc[0])}</div>${r.bc[1] ? `<div class="card__links">${chip(r, r.bc[1])}</div>` : ''}</div>`;
  if (!topics.length){
    h += `<p class="empty">${r.bp ? 'Switchboard reads this conversation now.' : 'Switchboard reads a conversation once its agent stops, and again when it has grown. Nothing read yet.'}</p>`;
  } else {
    // The pieces of work in the order they came up; the newest is the one going on now.
    const lastOpen = topics.map(t => t.s !== 'done').lastIndexOf(true);
    h += `<div class="sess__label">Worked on in this session</div><div class="timeline">${topics.map((t, i) => topic(r, t, i === lastOpen)).join('')}</div>`;
  }
  if ((r.bl || []).length) h += `<div class="sess__label">Put off for later</div><div class="timeline">${r.bl.map(x => `<article class="topic"><div class="card__tab"><span class="nm">${esc(x)}</span><span class="state state--wait">◷ Later</span>${ask(r, x)}</div></article>`).join('')}</div>`;
  if (r.bd){
    const last = topics[topics.length - 1];
    h += `<div class="drift"><span><b>✦ New topic:</b> ${esc(last ? last.t : 'the latest messages')}. It is not what this session started on.</span>
      <div class="btn-row"><button class="btn btn--solid" style="--btn:var(--accent)" data-drift="doc">Start a Doc for it</button><button class="btn" style="--btn:var(--accent)" data-drift="split">Split into a new session</button></div></div>`;
  }
  const lk = r.lk || [];
  if (lk.length){
    const kind = {doc: 'Doc', dev: 'Dev', artifact: 'Page'};
    h += `<details class="links"><summary class="sess__label">All links · ${lk.length} ›</summary><div class="linklist">${lk.map(l => `<a data-link="${esc(l[1])}" title="${esc(l[1])}"><small>${kind[l[0]] || l[0]}</small><span>${esc(l[2] || l[1])}</span></a>`).join('')}</div></details>`;
  }
  // Only when something changed, and where you scrolled to stays.
  if (h === render.last) return;
  render.last = h;
  const keepOpen = $('details.links')?.open, y = scrollY;
  $('#app').innerHTML = h;
  if (keepOpen) $('details.links').open = true;
  scrollTo(0, y);
}

document.addEventListener('click', e => {
  const ln = e.target.closest('[data-link]'); if (ln){ e.preventDefault(); bridge('link', {url: ln.dataset.link}); return; }
  const a = e.target.closest('[data-ask]');
  if (a){ const r = rows.find(x => x.k === pinnedK); if (r) bridge('op', {o: {op: 'draft', k: r.k, text: a.dataset.ask}}); return; }
  const d = e.target.closest('[data-drift]');
  if (d){
    const r = rows.find(x => x.k === pinnedK); if (!r) return;
    const topics = r.bt || [], last = topics[topics.length - 1];
    if (d.dataset.drift === 'doc'){
      bridge('op', {o: {op: 'send', k: r.k, text: `Start a separate Simplero Doc for the new topic${last ? ' (' + last.t + ')' : ''}, apart from this session's main Doc, and keep that topic's work there.`}});
    } else {
      const sid = r.k.startsWith('claude:') ? r.k.slice(7) : '';
      bridge('op', {o: {op: 'new', login: r.ld || '~/.claude', cwd: r.cwd || '~', focus: true,
        prompt: `Take over a topic from the session “${r.n}” (Claude conversation ${sid}; its transcript is under ~/.claude*/projects). Read the end of that conversation, then continue this topic only: ${last ? last.t : 'its latest topic'}.`}});
    }
  }
});
bridge('ready');
</script>
</body></html>
