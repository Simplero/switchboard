<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions</title>
<style>
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --sunk:#EFEEEA; --line:#E2E1DC; --line2:#D2D1CB;
  --ink:#17171A; --ink2:#3A3A42; --muted:#5A5A62; --muted2:#7A7A82; --faint:#A0A0A7;
  --accent:#2D5BE3; --accent-soft:#E7EDFD; --sel:#3B5BDB; --sel-ink:#FFFFFF;
  --needs:#C25A12; --needs-soft:#FCEFE4; --work:#2D5BE3; --done:#1E7A4C; --label:#2D5BE3;
  --c-blue:#2D5BE3; --c-yellow:#B7791F; --c-violet:#6E4BD8; --c-pink:#C2357A; --c-aqua:#1B8A9C; --c-lime:#5E8A12; --c-gray:#7A7A82;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16161A; --surface:#1E1E23; --sunk:#26262C; --line:#2C2C33; --line2:#3A3A42;
    --ink:#EDEDF0; --ink2:#C9C9CF; --muted:#A3A3AA; --muted2:#85858D; --faint:#606068;
    --accent:#7FA2FF; --accent-soft:#232B45; --sel:#3B5BDB; --sel-ink:#FFFFFF;
    --needs:#F2A15C; --needs-soft:#3A2618; --work:#7FA2FF; --done:#5BC98E; --label:#7FA2FF;
    --c-blue:#7FA2FF; --c-yellow:#E5B85C; --c-violet:#B39BFF; --c-pink:#F28CB8; --c-aqua:#6FCFDC; --c-lime:#A9D267; --c-gray:#8A8A92;
  }
  #scrim{background:rgba(0,0,0,.35)}
  #newform{box-shadow:0 14px 36px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.3)}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:default}
#app{display:flex;flex-direction:column;height:100%;position:relative}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace}

/* top */
#top{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.newbtn{border:0;background:var(--sunk);border-radius:7px;padding:4px 8px;font-weight:600;font-size:12px;display:inline-flex;gap:4px;align-items:center}
.newbtn:disabled{opacity:.55;cursor:default}
.newbtn:hover{background:var(--line2)}
.newbtn .plus{color:var(--done);font-weight:800}
.newbtn[aria-pressed=true]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.newbtn.big{padding:6px 12px;font-size:13px;border-radius:8px}
.newbtn.big .plus{font-size:15px;line-height:1}
/* Your Claude subscriptions, next to New session: how much of the week is left, and how the
   week has gone. A click shows only that login's sessions. Room on the right for the sidebar button. */
#newbtns{padding-right:30px;row-gap:6px;gap:8px}
#subs{display:flex;gap:6px;flex:1 1 280px;min-width:0;justify-content:flex-end}
.subbtn{flex:0 1 auto;min-width:0;border:0;background:var(--sunk);border-radius:8px;padding:4px 8px;display:flex;flex-direction:column;gap:2px;text-align:left}
.subbtn:hover{background:var(--line2)}
.subbtn[aria-pressed=true]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.subbtn .ln{display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap}
.subbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted)}
.subbtn[aria-pressed=true] .nm{color:var(--ink)}
.subbtn .rs{display:inline-flex;align-items:center;gap:2px;font-size:10px;color:var(--muted2);font-variant-numeric:tabular-nums}
.subbtn svg.wk{flex:1 1 34px;min-width:0;height:15px;color:var(--accent)}
.subbtn .pct{flex:none;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.subbtn.hi svg.wk,.subbtn.hi .pct{color:var(--needs)}
.subbtn .rs.gr{color:var(--done);font-weight:600}

/* new-session form: drops down under the + buttons, over the list (nothing below moves) */
#scrim{position:absolute;left:0;right:0;bottom:0;z-index:20;background:rgba(20,20,26,.08)}
#newform{position:absolute;left:10px;right:10px;z-index:21;background:var(--surface);border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08);padding:12px;display:flex;flex-direction:column;gap:8px}
#newform .hd{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
#newform .hd .x{margin-left:auto;border:0;background:transparent;color:var(--muted2);font-size:17px;line-height:1;padding:1px 5px;border-radius:5px}
#newform .hd .x:hover{background:var(--sunk);color:var(--ink)}
#newform .pick{display:flex;align-items:center;gap:8px;min-width:0}
#newform .pick .lbl{width:54px;flex:none;font-size:11.5px;font-weight:600;color:var(--muted)}
#newform .pick .dirbtn{max-width:none;min-width:0;padding:4px 9px;font-size:12.5px}
#newform .logins{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
#newform .logins .newbtn{padding:4px 9px}
#newform .sub{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
#newform .sub .mono{color:var(--ink2)}
#newform .rd{display:inline-flex;align-items:center;gap:4px}
#newform .rd.on{color:var(--done);font-weight:600}
#newform .rd.bad{color:var(--needs);font-weight:600}
#newform textarea,#newform input{width:100%;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--ink);
  font:inherit;font-size:13px;line-height:1.45;padding:7px 9px;outline:0;user-select:text;-webkit-user-select:text;resize:none;display:block}
#newform textarea{min-height:88px;max-height:240px}
#newform textarea::placeholder,#newform input::placeholder{color:var(--faint)}
#newform textarea:focus,#newform input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#newform .files{display:flex;flex-wrap:wrap;gap:5px}
#newform .files:empty{display:none}
#newform .file{display:inline-flex;align-items:center;gap:4px;max-width:100%;min-width:0;background:var(--sunk);border-radius:6px;padding:2px 2px 2px 7px;font-size:11.5px;color:var(--ink2)}
#newform .file span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
#newform .file button{border:0;background:transparent;color:var(--muted2);padding:0 4px;font-size:14px;line-height:1;border-radius:4px}
#newform .file button:hover{background:var(--line2);color:var(--ink)}
#newform .ft{display:flex;align-items:center;gap:8px}
#newform .hint{font-size:11px;color:var(--muted2);flex:1;min-width:0}
#newform .hint kbd{font:inherit;font-weight:600;color:var(--muted)}
#newform .go{border:0;background:var(--sel);color:var(--sel-ink);border-radius:7px;padding:5px 14px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
#newform .go:hover{filter:brightness(1.08)}
#newform .dropnote{display:none}
#newform.drop{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 12px 32px rgba(0,0,0,.18)}
#newform.drop .dropnote{display:flex;align-items:center;justify-content:center;gap:6px;position:absolute;inset:0;border-radius:12px;
  background:color-mix(in srgb, var(--surface) 88%, transparent);border:2px dashed var(--accent);color:var(--accent);font-weight:700;font-size:13px;pointer-events:none}
.dirbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:transparent;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;color:var(--ink2);max-width:240px}
.dirbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dirbtn:hover{border-color:var(--accent)}
/* A column's folder filter: "All folders", or the one folder it shows (then it stands out). */
.colfolder{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);background:transparent;border-radius:6px;padding:1px 7px;font-size:10.5px;font-weight:500;color:var(--muted2);max-width:100%;min-width:0}
.colfolder span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colfolder:hover{color:var(--ink);border-color:var(--accent)}
.colfolder.on{color:var(--ink);font-weight:650;border-color:var(--ink)}
.colfolder .x{margin-left:2px;font-weight:600}
.idhit{margin:6px 10px 10px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.idhit .t{font-weight:700;font-size:13.5px}
.idhit .m{font-size:12px;color:var(--muted)}
.idhit .btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.idhit .btns .lbl{font-size:12px;color:var(--muted)}
#search{display:flex;align-items:center;gap:6px;background:var(--sunk);border-radius:8px;padding:6px 9px;flex:1;min-width:0}
/* back, forward, history: like a browser, next to the search box */
.navrow{display:flex;align-items:center;gap:6px}
.navbtns{display:inline-flex;gap:2px}
.navbtns button{border:0;background:transparent;color:var(--ink2);width:28px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center}
.navbtns button:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.navbtns button:disabled{color:var(--faint);opacity:.55}
/* Pinned: sessions that stay (Chief of staff, lazygit). Not in the lists below. ⌃1…⌃9 open them. */
.newq{display:flex;align-items:center;gap:8px;width:calc(100% - 12px);margin:8px 6px;padding:9px 12px;border:1.5px dashed var(--line2);border-radius:9px;background:none;color:var(--ink2);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.newq:hover{border-color:var(--accent);color:var(--ink)}
.newq .plus{font-weight:800;color:var(--accent)}
.newq b{font-weight:650;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pins{display:flex;flex-direction:column;gap:6px}
.pinrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pin{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:6px 8px;min-width:0;text-align:left;color:var(--ink);font:inherit}
.pin:hover{border-color:var(--muted2)}
.pin .pi{display:inline-flex;flex:none}
.pin .pt{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.pin b{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin small .w{font-weight:650}
.pin kbd{margin-left:auto;flex:none;font:600 10.5px ui-monospace,SFMono-Regular,monospace;color:var(--muted2);border:1px solid var(--line2);border-radius:4px;padding:1px 4px}
.pin.off b{color:var(--muted)}
/* Turn off: a running pin stops (frees its memory) and stays pinned; a click starts it again. */
.pin .poff{display:none;flex:none;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;color:var(--muted);margin-left:auto}
.pin .poff + kbd{margin-left:4px}
.pin:hover .poff{display:inline-flex}
.pin .poff:hover{background:var(--line2);color:var(--ink)}
.pin.sel .poff{color:#E3E8FF}
.pin.sel .poff:hover{background:rgba(255,255,255,.18);color:#fff}
/* The first click only asks: the button says "Turn off?" in words. A second click turns it off. */
.pin .poff.arm{display:inline-flex;width:auto;gap:3px;padding:0 6px;font-size:11px;font-weight:650;white-space:nowrap;background:var(--needs-soft);color:var(--needs);box-shadow:inset 0 0 0 1px var(--needs)}
.pin .poff.arm:hover{background:var(--needs-soft);color:var(--needs)}
.pin.sel .poff.arm,.pin.sel .poff.arm:hover{background:#fff;color:var(--sel);box-shadow:none}
.pin.sel{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.pin.sel small,.pin.sel kbd{color:#E3E8FF}
.pin.sel kbd{border-color:rgba(255,255,255,.45)}
.pin.dragging{position:relative;z-index:2;box-shadow:0 8px 22px rgba(0,0,0,.22)}
body.dragging-pins,body.dragging-pins *{cursor:grabbing!important}
#search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;user-select:text;-webkit-user-select:text}
#search .key{font-size:10.5px;color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.seg{display:inline-flex;gap:1px}
.seg button{border:0;background:transparent;border-radius:5px;padding:2px 4px;font-size:10.5px;color:var(--muted2);white-space:nowrap}
.ctrl .row{flex-wrap:nowrap}
.ctrl .seg{flex-wrap:wrap}
.seg button[aria-pressed=true]{background:var(--sunk);color:var(--ink);font-weight:600}
.seg button:hover{color:var(--ink)}

/* now card */
#now{margin:10px 12px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:none;flex-direction:column;gap:8px}
#now.on{display:flex}
#now .head{display:flex;align-items:center;gap:8px}
#now .name{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.b-needs{background:var(--needs-soft);color:var(--needs)}
.b-work{background:var(--accent-soft);color:var(--work)}
.b-done{background:var(--sunk);color:var(--done)}
.b-quiet{background:var(--sunk);color:var(--muted)}
#now .title{color:var(--muted);font-size:12.5px}
#now .next{border:2px solid var(--needs);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
#now .next.calm{border-color:var(--line2)}
#now .next .lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--needs)}
#now .next.calm .lbl{color:var(--muted)}
#now .next p{margin:0;font-size:14.5px;font-weight:700;line-height:1.35}
.replies{display:flex;gap:6px;flex-wrap:wrap}
.reply{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 10px;font-weight:600;font-size:12px}
.reply:first-child{border:2px solid var(--accent);background:var(--accent-soft)}
.reply:hover{background:var(--sunk)}
#now .said{font-size:12.5px;color:var(--ink2)}
#now .said b{color:var(--muted);font-weight:600}
#now .meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);font-size:11px;font-weight:600}
#now .hide{border:0;background:transparent;color:var(--faint);font-size:11px}

/* lists */
#cols{flex:1;min-height:0;display:flex;gap:0}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;min-height:0}
.col + .col{border-left:1px solid var(--line)}
.ctrl{padding:8px 12px 6px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.fchip{border:0;border-radius:6px;padding:3px 8px;font-size:11.5px;background:var(--sunk);color:var(--muted)}
.fchip[aria-pressed=true]{background:var(--sel);color:var(--sel-ink);font-weight:600}
[data-w].fchip{background:transparent;border:1px solid var(--line2)}
[data-w].fchip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{flex:1;min-height:0;overflow-y:auto;padding:2px 6px 24px}
.group{display:flex;align-items:center;gap:6px;padding:12px 8px 4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.group .n{color:var(--faint);font-weight:600}
.group .chev{transition:transform .15s;display:inline-block;color:var(--faint)}
.group.folded .chev{transform:rotate(-90deg)}

.item{display:flex;gap:9px;padding:9px 10px;border-radius:10px;align-items:flex-start}
.item:hover{background:var(--sunk)}
.item.sel{background:var(--sel);color:var(--sel-ink)}
/* The session in front, in a column that ⌘↑ ⌘↓ do not follow: a border only. The filled row
   shows the column the keys follow. */
.item.sel-ring{box-shadow:inset 0 0 0 2px var(--sel)}
/* Manual order: drag a row to move it (within its group). */
.col.manual .item[data-k]{cursor:grab}
body.dragging-rows,body.dragging-rows *{cursor:grabbing!important}
.item.dragging{position:relative;z-index:2;box-shadow:0 8px 22px rgba(0,0,0,.22),0 0 0 1px var(--line2)}
.item.dragging:not(.sel){background:var(--surface)}
/* Keyboard cursor (⌘P, then arrows). Solid ring: running here, the terminal follows it.
   Dashed ring: not running here, Enter opens it. */
.cur{outline:2px solid var(--accent);outline-offset:1px}
.cur.cur-off{outline-style:dashed}
.item.sel .line,.item.sel .meta,.item.sel .age{color:#E3E8FF}
.item .ico{width:16px;flex-shrink:0;display:flex;justify-content:center;padding-top:2px}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .top{display:flex;gap:8px;align-items:baseline}
.item .pri{flex:none;align-self:center;display:inline-flex;color:var(--needs);margin-right:-3px}
.item .pri svg{fill:currentColor}
.item.sel .pri{color:inherit}
.item .name{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .age{margin-left:auto;font-size:11px;color:var(--muted2);white-space:nowrap}
/* Every running row has the same height: the status line always takes two lines and the
   meta line one, so a live "Working… (2m 6s · 8.4k tokens)" never pushes rows below it. */
.item .line{font-size:12.5px;line-height:1.45;height:2.9em;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .word{font-weight:700}
.item .meta{font-size:11px;line-height:1.45;height:1.45em;color:var(--muted2);display:flex;gap:6px;align-items:center;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.item .meta .lab{color:var(--label)}
/* Runs on another machine (a Linux box): its name, with a server icon, after the login. */
.item .meta .mach{color:var(--ink2);font-weight:600}
.item.sel .meta .mach{color:inherit}
/* The folder and the branch: when the line is too narrow, the branch gets shorter (a long folder too). */
.item .meta>span{flex:none}
.item .meta .dir{max-width:62%;overflow:hidden;text-overflow:ellipsis}
.item .meta .dir:first-child{max-width:100%}
/* Move to folder: where it goes when its turn is over. The folder before it gets shorter first. */
.item .meta .mv{flex:0 0.01 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .meta .dir.shrink{flex:0 1 auto;min-width:3em}
.item .meta .br{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}

.else{display:flex;gap:7px;align-items:center;padding:5px 10px;border-radius:7px;color:var(--ink2);font-size:12.5px;font-weight:600}
.else:hover{background:var(--sunk)}
.else .dot{width:14px;display:flex;justify-content:center;color:var(--work)}
.else .dot i{width:6px;height:6px;border-radius:3px;border:1.5px solid var(--muted2);display:block}
.else .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.else .tag,.old .tag{flex:none;font-size:10px;font-weight:600;color:var(--muted2);border:1px dashed var(--line2);border-radius:4px;padding:0 4px}
.else .age{font-size:10.5px;color:var(--muted2);font-weight:400}
.old{display:flex;gap:7px;align-items:center;padding:4px 10px;border-radius:7px;color:var(--muted2);font-size:11.5px}
.old:hover{background:var(--sunk)}
.old .nm{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.old .tt{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.old .age{font-size:10.5px;color:var(--faint)}
.empty{padding:14px 12px;color:var(--muted2);font-size:12.5px}
/* search: a conversation that says the words, with the words around the match */
.hit{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:8px}
.hit:hover{background:var(--sunk)}
.hit .r1{display:flex;gap:7px;align-items:baseline;min-width:0}
.hit .nm{font-weight:600;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* Its Board column: the column's name, with a dot in the column's color (the name says it, not the color). */
.bk{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:4px;padding:0 5px;line-height:1.5;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.bk i{flex:none;width:6px;height:6px;border-radius:3px;background:var(--col,var(--c-gray))}
.item .top .bk{align-self:center}
.item.sel .bk{background:rgba(255,255,255,.18);color:#fff}
.item.sel .bk i{background:#fff}
.hit .tag{flex:none;font-size:10px;font-weight:600;color:var(--muted2);border:1px dashed var(--line2);border-radius:4px;padding:0 4px}
.hit .age{margin-left:auto;flex:none;font-size:10.5px;color:var(--muted2)}
.hit .sn{font-size:12px;line-height:1.45;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.hit .mt{font-size:11px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sn mark{background:var(--needs-soft);color:var(--ink);font-weight:700;border-radius:3px;padding:0 1px}
/* search: under the name results, the row that also looks inside every conversation */
.deeprow{display:flex;align-items:center;gap:8px;margin:12px 4px 4px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;color:var(--ink2);font-size:12.5px;cursor:pointer}
.deeprow:hover{background:var(--sunk)}
.deeprow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deeprow b{color:var(--ink);font-weight:600}
.deeprow kbd{flex:none;font:600 10.5px ui-monospace,SFMono-Regular,monospace;color:var(--muted2);border:1px solid var(--line2);border-radius:4px;padding:1px 4px}
.deephead{margin-top:10px;border-top:1px solid var(--line);padding-top:14px}
.ixnote{margin:6px 10px 10px;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
svg{flex-shrink:0}
.spin{animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="newbtns" class="row"></div>
    <div class="navrow">
    <span class="navbtns">
      <button id="navBack" disabled title="Back to the session before (⌘[)" aria-label="Back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button id="navFwd" disabled title="Forward (⌘])" aria-label="Forward"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
      <button id="navHist" title="History: the sessions you visited, back and forward" aria-label="History"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/><polyline points="12 7 12 12 15.5 14"/></svg></button>
    </span>
    <label id="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search, or move with the arrow keys…" autocomplete="off" spellcheck="false">
      <span class="key" id="qkey">⌘O</span>
    </label>
    </div>
    <div id="pins" class="pins" hidden></div>
    <div class="row"><span class="cap">Columns</span><span class="seg" id="colseg"></span></div>
  </div>
  <div id="cols"></div>
  <div id="scrim" hidden></div>
  <div id="newform" hidden role="dialog" aria-label="New Claude session">
    <div class="hd"><span id="nfhead"></span><button class="x" data-nf="cancel" title="Close (esc). What you wrote stays for next time.">×</button></div>
    <div class="pick" id="nfmachrow" hidden><span class="lbl">Machine</span><span class="logins" id="nfmachines"></span></div>
    <div class="pick"><span class="lbl">Folder</span><button id="dirbtn" class="dirbtn" data-nf="folder" title="The folder this session starts in. Click to pick another one. The next session starts in ~/Simplero again."></button></div>
    <div class="pick"><span class="lbl">Agent</span><span class="logins" id="nfagents"></span></div>
    <div class="pick" id="nfloginrow"><span class="lbl">Login</span><span class="logins" id="nflogins"></span></div>
    <div class="sub" id="nfsub"></div>
    <textarea id="nfmsg" rows="4" placeholder="First message (optional)" spellcheck="true"></textarea>
    <div class="files" id="nffiles"></div>
    <input id="nfname" placeholder="Name (optional)" autocomplete="off" spellcheck="false">
    <div class="ft"><span class="hint"><kbd>↩</kbd> start · <kbd>⇧↩</kbd> new line · drop or paste files</span><button class="go" data-nf="go">Start</button></div>
    <div class="dropnote">Drop to attach</div>
  </div>
</div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bridge = (type, data={}) => { try { window.webkit.messageHandlers.sessions.postMessage({type, ...data}); } catch (e) {} };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const ICON = {
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  q:'<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4"/><path d="M12 17h.01"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  warn:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  hand:'<path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  spin:'<path d="M21 12a9 9 0 1 1-6.2-8.56"/>',
  power:'<path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  dots:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  pause:'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  archive:'<rect x="2" y="4" width="20" height="5" rx="1"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/>',
  term:'<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>',
  brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  chev:'<polyline points="6 9 12 15 18 9"/>',
  find:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  clip:'<path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
};
const ic = (n, s=14, w=2.1, cls='') => `<svg class="${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

// state → [icon, word, css class, color var]. Never color alone: icon + word.
const LOOK = {
  urgent:['warn','Urgent','b-needs','--needs'], permission:['hand','Approve','b-needs','--needs'],
  question:['q','Answer','b-needs','--needs'], review:['eye','Look at it','b-needs','--needs'],
  heads_up:['warn','Read this','b-needs','--needs'], wrong_login:['warn','Wrong login','b-needs','--needs'],
  working:['spin','Working','b-work','--work'], reading:['dots','Reading','b-quiet','--muted'],
  done:['check','Done','b-done','--done'], handled:['check','Handled','b-done','--done'],
  info:['check','Answered','b-quiet','--muted'], parked:['pause','Parked','b-quiet','--muted'],
  closed:['moon','Closed','b-quiet','--muted'], archived:['archive','Archived','b-quiet','--muted'],
  shell:['term','Terminal','b-quiet','--muted'],
};
// What each state means: the tooltip on its icon and word.
const TIP = {
  urgent:'Urgent: act soon. Money, customer data, production or a merge is at stake.',
  permission:'Approve: the agent waits for your OK to run something. Answer the dialog in the terminal.',
  question:'Answer: the agent asked you a question.',
  review:'Look at it: the agent wants you to look at or try something.',
  heads_up:'Read this: the agent warns you about something that needs your decision.',
  wrong_login:'Wrong login: this session runs with another login than it should.',
  working:'Working: the agent is busy. Nothing for you yet.',
  reading:'Reading: Switchboard is reading what the agent said.',
  done:'Done: the agent finished. Nothing for you.',
  handled:'Handled: you marked its message as handled.',
  info:'Answered: the agent answered or reported. Nothing for you.',
  parked:'Parked: closed, kept in the list. Click to resume it.',
  closed:'Closed: not running. Click to reopen it.',
  archived:'Archived: you were done with it. Click to resume it.',
  shell:'Terminal: a shell, no agent.',
};
const NEEDS = new Set(['permission','question','review','heads_up','wrong_login']);
// Pinned sessions stay in the Pinned row: never in the lists or the counts.
const isPin = s => s.pn != null;
const LOGIN_ICON = {'simplero.com':'brief','corre.li':'person','correli.me':'star'};
const stateOf = s => (s.u && NEEDS.has(s.st)) ? 'urgent' : (s.st || 'info');
const needsYou = s => { const st = stateOf(s); return st === 'urgent' || NEEDS.has(st); };
// The agent finished what you asked: Done, Answered, or a message you marked as handled.
const FINISHED = new Set(['done', 'info', 'handled']);
const isFinished = s => s.a !== 'shell' && FINISHED.has(stateOf(s));
// A new answer: the turn ended (Done or Answered) after the last time you had the session in
// front. It is in Needs you until you go to it, so the answers you waited for are in the loop.
const isNewAnswer = s => s.o && s.a !== 'shell' && s.fa > 0 && (stateOf(s) === 'done' || stateOf(s) === 'info') && s.fa > seenAt(s.k);
const wantsYou = s => needsYou(s) || isNewAnswer(s);

let data = null, focusSf = null, query = '', results = [], idHit = null;
// "Search inside conversations" (only when you ask for it): on or not, waiting for the answer,
// the conversations that say the words (not the ones the name search shows), how many in all,
// and how far the index is.
let deep = false, deepBusy = false, deepGen = 0, convHits = [], convTotal = 0, ixState = null;
// The folder a new session starts in: ~/Simplero, unless you pick another one for this session.
const HOME_FOLDER = '~/Simplero';
let newCwd = HOME_FOLDER;
let visits = store.get('visits', {});
// When you last had each session in front (also while you stay in it). Answers from before the
// first run of this do not count as new.
const seen = store.get('seen', {});
let seenBase = store.get('seenBase', 0);
if (!seenBase){ seenBase = Date.now()/1000; store.set('seenBase', seenBase); }
let seenSaved = 0;
const seenAt = k => Math.max(seen[k] || 0, visits[k] || 0, seenBase);
const seenSent = {};
function markSeen(k, t){
  seen[k] = t;
  if (t - seenSaved > 5){ seenSaved = t; store.set('seen', seen); }
  // The phone shows a new answer you already read here as read too.
  if (t - (seenSent[k] || 0) > 5){ seenSent[k] = t; bridge('seen', {k, t: Math.floor(t)}); }
}
// Orders that never shift under the mouse:
//  manual: the order sessions first showed up in; new ones go at the end, a new name does not move a row.
//  recent: the "Recently visited" list; a session joins at the top on its first visit and then stays put.
let manual = store.get('manual', null);
let recent = store.get('recent', null);
let cols = store.get('cols', 2), showNow = store.get('showNow', true);
// Only the sessions of one login (a subscription button at the top), or all.
let loginFilter = store.get('loginFilter', null);
const loginOk = s => !loginFilter || s.ld === loginFilter;
// The column ⌘↑ ⌘↓ follow: the one you last opened a session from. Its row for the session
// in front is filled; the other column only outlines it.
let navColPick = store.get('navCol', 0);
const navColOf = () => Math.min(navColPick, cols - 1);
function setNavCol(ci){ if (ci == null || ci === navColPick) return; navColPick = ci; store.set('navCol', ci); render(); }
const colState = [
  Object.assign({filter:'needs', group:'none', sort:'needs', where:'any'}, store.get('col0', {})),
  Object.assign({filter:'all', group:'none', sort:'manual', where:'any'}, store.get('col1', {})),
];
// "Elsewhere" (cmux) is gone: a column that showed it shows everything.
for (const c of colState) if (c.where === 'cmux') c.where = 'any';
// "Group" (cmux's workspace groups) is gone too: every session here fell in one "Switchboard" group.
for (const c of colState) if (c.group === 'cmux') c.group = 'none';
const folded = store.get('folded', {'Parked':true,'Closed recently':true});
if (!('Archive' in folded)) folded['Archive'] = true;   // the Archive starts folded

function ago(t){
  if (!t) return '';
  const d = Math.max(0, Date.now()/1000 - t);
  if (d < 60) return 'now';
  if (d < 3600) return Math.round(d/60) + 'm';
  if (d < 86400) return Math.round(d/3600) + 'h';
  return Math.round(d/86400) + 'd';
}

// Actions go through the app, which shows why when one does not work.
function op(o){ bridge('op', {o}); }
// A question for the app that has an answer (search).
async function ask(type, d={}){
  try { return await window.webkit.messageHandlers.sessionsReply.postMessage({type, ...d}); } catch { return null; }
}

// ---------- called by the app ----------
window.Sessions = {
  // The app sends the sessions whenever something changes.
  setData(d){ data = d; noteNeeds(); render(); },
  setFocus(sf){
    noteNeeds();   // the session you leave keeps its place for another 30 s from now
    seenSaved = 0;
    const moved = (sf || null) !== focusSf;
    focusSf = sf || null;
    const s = data?.s.find(x => x.sf === focusSf && x.o);
    if (s) {
      visits[s.k] = Date.now()/1000; store.set('visits', visits);
      seenSaved = 0; markSeen(s.k, visits[s.k]);
      if (recent && !recent.includes(s.k)){ recent.unshift(s.k); recent = recent.slice(0, 30); store.set('recent', recent); }
    }
    render();
    // ⌘↑ ⌘↓ (or any other switch) can select a row that is scrolled out of view: bring it in.
    if (moved) document.querySelectorAll('#cols .item.sel, #cols .item.sel-ring').forEach(reveal);
  },
  // The folder menu (native) picked a folder for new sessions.
  // A column's folder filter, from its menu ("" = all folders).
  setColFolder(ci, p){ const c = colState[ci]; if (!c) return; if (p) c.dir = p; else delete c.dir; store.set('col' + ci, c); render(); },
  setFolder(p){ if (p){ newCwd = p; if (!nfMachine()) bridge('newFolder', {cwd: p}); render(); if (nf.open) nfStatus(); } },
  // Files dropped on the page (the app knows their paths; the page only their names).
  droppedFiles(paths){ $('#newform').classList.remove('drop'); if (nf.open) addFiles(paths); },
  // The session did not start (the app said why): the message, name and files come back.
  // The keyboard left the page (a click in the terminal, or the page moved to another window):
  // no field may look focused, and the new-session form closes (its draft stays).
  keyboardLeft(){
    clearTimeout(blurTimer);
    const a = document.activeElement;
    if (a && a !== document.body) a.blur();
    if (kbd){ cur = null; setKbd(false); }
    if (nf.open) closeNew(false);
  },
  newFailed(){ if (nf.sent && !nfMsg.value && !nfName.value && !nf.files.length){ nfMsg.value = nf.sent.text; nfName.value = nf.sent.name; nf.files = nf.sent.files; nfFiles(); nfGrow(); } },
  // Switchboard went to the background (true) or came back (false).
  away(on){ awaySig = on ? rowSig() : null; },
  // Back and forward: whether the ‹ and › buttons can go anywhere.
  setHistory(b, f){ $('#navBack').disabled = !b; $('#navFwd').disabled = !f; },
  // ⌘P: start at the session in front.
  focusSearch(){ cur = null; q.focus(); q.select(); if (!cur) cur = initialCursor(); applyCursor(true); },
  // ⌘N: the New session form.
  openNewForm(){ if (query){ clearSearch(); render(); } openNew(); },
  // The app moved the page to the window the cursor just brought to the front.
  refocus(){ clearTimeout(blurTimer); q.focus(); setKbd(true); },
};


// ---------- keyboard: one cursor across both columns ----------
// ⌘P (or a click in the search box) puts the keyboard here. ↑ ↓ move in a column,
// ← → jump to the other column, typing searches, Enter opens, Esc goes back to the
// terminal. Moving only moves the highlight: the terminal changes on Enter.
let cur = null;          // {col, k}
let kbd = false;         // the search box has the keyboard
let blurTimer;
const q = $('#q');
const colRows = ci => [...document.querySelectorAll(`#cols .col[data-col="${ci}"] [data-k]`)];
const sessionOf = k => (data && data.s.find(x => x.k === k)) || results.find(x => x.k === k) || convHits.find(x => x.k === k);
const runsHere = s => s && s.o && s.be === 'ghostty';

function initialCursor(){
  const cis = query ? [0] : [...Array(cols).keys()];
  for (const ci of cis){
    const here = colRows(ci).find(el => { const s = sessionOf(el.dataset.k); return s && s.sf && s.sf === focusSf; });
    if (here) return {col: ci, k: here.dataset.k};
  }
  for (const ci of cis){ const first = colRows(ci)[0]; if (first) return {col: ci, k: first.dataset.k}; }
  return null;
}
// Scroll a row's own list just enough to show the whole row, with a small gap at the edge.
// (scrollIntoView would also scroll the page itself, which has overflow hidden.)
function reveal(el){
  const list = el.closest('.list');
  if (!list) return;
  const r = el.getBoundingClientRect(), l = list.getBoundingClientRect(), gap = 6;
  if (r.top < l.top + gap) list.scrollTop -= l.top + gap - r.top;
  else if (r.bottom > l.bottom - gap) list.scrollTop += Math.min(r.bottom - l.bottom + gap, r.top - l.top - gap);
}
// Mark the cursor row; if its session left the column, take the row now at the same place.
function applyCursor(scroll){
  document.querySelectorAll('.cur').forEach(el => el.classList.remove('cur', 'cur-off'));
  if (!kbd || !cur) return;
  const rows = colRows(cur.col);
  if (!rows.length) return;
  let el = rows.find(r => r.dataset.k === cur.k);
  if (!el){ el = rows[Math.min(cur.i || 0, rows.length - 1)]; cur.k = el.dataset.k; }
  cur.i = rows.indexOf(el);
  el.classList.add('cur');
  if (!runsHere(sessionOf(cur.k))) el.classList.add('cur-off');
  if (scroll) reveal(el);
}
function moveTo(col, el){
  if (!el) return;
  cur = {col, k: el.dataset.k};
  applyCursor(true);
}
function step(d){
  if (!cur){ cur = initialCursor(); applyCursor(true); return; }
  const rows = colRows(cur.col), i = rows.findIndex(r => r.dataset.k === cur.k);
  moveTo(cur.col, rows[Math.max(0, Math.min(rows.length - 1, (i < 0 ? 0 : i + d)))]);
}
function otherColumn(){
  if (query || cols < 2) return;
  if (!cur){ cur = initialCursor(); applyCursor(true); return; }
  const to = 1 - cur.col, rows = colRows(to);
  if (!rows.length) return;
  const same = rows.find(r => r.dataset.k === cur.k);
  if (same) return moveTo(to, same);
  const from = colRows(cur.col).find(r => r.dataset.k === cur.k);
  const y = from ? from.getBoundingClientRect().top : 0;
  moveTo(to, rows.reduce((a, b) => Math.abs(b.getBoundingClientRect().top - y) < Math.abs(a.getBoundingClientRect().top - y) ? b : a));
}
function setKbd(on){
  kbd = on;
  q.placeholder = on ? 'Type to search · arrows move · Enter opens' : 'Search, or move with the arrow keys…';
  $('#qkey').textContent = on ? 'esc' : '⌘O';
  applyCursor(on);
}
q.addEventListener('focus', () => { clearTimeout(blurTimer); if (!cur) cur = initialCursor(); setKbd(true); });
// The page loses focus for a moment when the app moves it to another window: wait before hiding the cursor.
q.addEventListener('blur', () => { blurTimer = setTimeout(() => { if (document.activeElement !== q) setKbd(false); }, 250); });

let searchTimer, searchGen = 0;
function clearSearch(){ clearTimeout(searchTimer); searchGen++; q.value = ''; query = ''; results = []; idHit = null; clearDeep(); }
function clearDeep(){ deep = false; deepBusy = false; deepGen++; convHits = []; convTotal = 0; }
q.addEventListener('input', e => {
  query = e.target.value.trim();
  clearTimeout(searchTimer);
  const gen = ++searchGen;
  if (!query){ results = []; idHit = null; clearDeep(); render(); cur = initialCursor(); applyCursor(true); return; }
  searchTimer = setTimeout(async () => {
    let j = null;
    j = await ask('search', {q: query});
    if (gen !== searchGen) return;   // a newer search, or Esc, came after this one
    results = (j && j.s) || []; idHit = (j && j.id) || null;
    cur = null;
    if (deep) runDeep(false); else render();
    const first = colRows(0)[0];
    if (first){ cur = {col: 0, k: first.dataset.k}; applyCursor(true); }
  }, 120);
});
// "Search inside conversations": only when you ask for it (the row under the results, or ⌘↩).
// It stays on while you change the words, until you clear the search. `jump`: you asked for it
// now, so the list scrolls to the results and the cursor goes to the first one.
function runDeep(jump){
  if (!query) return;
  const gen = ++deepGen, words = query;
  deep = true; deepBusy = true; convHits = []; convTotal = 0;
  if (jump) cur = null;   // the row you pressed goes away; the cursor waits for the first result
  render();
  if (jump) showDeep(false);
  ask('search', {q: words, deep: true}).then(j => {
    if (gen !== deepGen || words !== query) return;   // newer words, or Esc, came after this
    convHits = (j && j.conv) || []; convTotal = (j && j.cn) || 0; ixState = (j && j.ix) || null; deepBusy = false;
    render();
    if (jump) showDeep(true);
  });
}
function showDeep(toFirst){
  const head = $('#cols .deephead'), list = head && head.closest('.list');
  if (!list) return;
  const off = head.getBoundingClientRect().top - list.getBoundingClientRect().top - 4;
  if (off > 0) list.scrollTop += off;
  const first = toFirst && $('#cols .deephead ~ [data-k]');
  if (first){ cur = {col: 0, k: first.dataset.k}; applyCursor(false); }
}
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); step(e.key === 'ArrowDown' ? 1 : -1); return; }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !query){ e.preventDefault(); otherColumn(); return; }
  if (e.key === 'Escape'){
    e.preventDefault();
    if (query){ clearSearch(); render(); cur = initialCursor(); applyCursor(true); return; }
    cur = null; bridge('blur'); return;
  }
  if (e.key === 'Enter'){
    e.preventDefault();
    if (query && cur && cur.k === '__new'){ newFromQuery(); return; }
    if (query && (e.metaKey || (cur && cur.k === '__deep'))){ runDeep(true); return; }
    const s = sessionOf(cur && cur.k) || results[0];
    if (!s && query && !idHit){ newFromQuery(); return; }
    if (s){ if (!query && cur) setNavCol(cur.col); cur = null; openSession(s, query ? 'Enter in the sidebar search (“' + query.slice(0, 40) + '”)' : 'Enter in the sidebar'); }
  }
});

// Nothing found (or not what you want): a new session from what you typed. A short word or
// two is its name ("triggers"); a sentence is its first message.
function newFromQueryHTML(){
  return `<button class="newq" data-newq data-k="__new" title="Start a new session ${/\s/.test(query) && query.length > 30 ? 'with this as its first message' : 'with this name'} (Return when nothing matches)"><span class="plus">+</span>New session: <b>${esc(query.slice(0, 80))}</b></button>`;
}
function newFromQuery(){
  const text = query;
  clearSearch();
  openNew();
  if (text.length <= 40 && text.split(/\s+/).length <= 3){ nfName.value = text; nfMsg.focus(); }
  else { nfMsg.value = text; nfGrow(); nfMsg.focus(); }
  render();
}

function openSession(s, via){
  if (query){ setTimeout(() => { clearSearch(); render(); }, 1500); }
  // A conversation from the index, not in the list: resume it here.
  if (s.k.startsWith('conv:')){ op({op:'resume_conv', key: s.k.slice(5)}); return; }
  bridge('open', {k: s.k, via: via || 'a click on the sidebar'});
}

// ---------- "Needs you" holds rows ----------
// A session that stops needing you (you answered it) keeps its place for 30 s, and for as
// long as it is the session in front: the list does not jump under you, and ⌘↑ gets you
// back to it to add more. It shows its real state meanwhile. If it needs you again while it
// is in front, it also keeps its place: it goes to the end of the list only when you leave it,
// so ⌘↓ from it still goes to the session that was after it.
const HOLD = 30;
const needsMemo = {};   // key → {last: when it last needed you (or was in front), since: needs-you time}
let holdTimer;
function noteNeeds(){
  if (!data) return;
  const t = Date.now() / 1000;
  const open = new Set();
  for (const s of data.s){
    if (!s.o) continue;
    open.add(s.k);
    const front = s.sf && s.sf === focusSf;
    if (front) markSeen(s.k, t);
    if (wantsYou(s)) needsMemo[s.k] = {last: t, since: front && needsMemo[s.k] ? needsMemo[s.k].since : s.nsn || s.fa || s.la || t};
    else if (needsMemo[s.k] && front) needsMemo[s.k].last = t;
  }
  let next = Infinity;
  for (const k of Object.keys(needsMemo)){
    const s = data.s.find(x => x.k === k);
    if (!open.has(k) || (!wantsYou(s) && t - needsMemo[k].last > HOLD)) delete needsMemo[k];
    else if (!wantsYou(s)) next = Math.min(next, needsMemo[k].last + HOLD);
  }
  clearTimeout(holdTimer);
  if (next < Infinity) holdTimer = setTimeout(() => { noteNeeds(); render(); }, Math.max(0, next - t) * 1000 + 300);
}
const heldNeeds = s => wantsYou(s) || !!needsMemo[s.k];

// ---------- building lists ----------
function groupKey(c, s){
  if (c.group === 'login') return s.lg || '';
  if (c.group === 'folder') return (s.rm ? s.rm + ':' : '') + (s.cwd || '~');
  return s.c || 'Work';
}
// Seed the stable orders once from what the list showed before (A–Z and visit time),
// so switching to them does not move anything.
function ensureOrders(){
  if (!data) return;
  // A row whose key changed (a new session gets its conversation id): keep its place,
  // its visit time and the keyboard cursor on it.
  for (const s of data.s){
    if (!s.was || s.was === s.k) continue;
    if (manual){ const i = manual.indexOf(s.was); if (i >= 0){ if (manual.includes(s.k)) manual.splice(i, 1); else manual[i] = s.k; store.set('manual', manual); } }
    if (recent){ const i = recent.indexOf(s.was); if (i >= 0){ if (recent.includes(s.k)) recent.splice(i, 1); else recent[i] = s.k; store.set('recent', recent); } }
    if (visits[s.was] != null){ visits[s.k] = Math.max(visits[s.k] || 0, visits[s.was]); delete visits[s.was]; store.set('visits', visits); }
    if (cur && cur.k === s.was) cur.k = s.k;
  }
  if (!manual){ manual = data.s.filter(s => s.o).sort((a,b) => a.n.localeCompare(b.n)).map(s => s.k); store.set('manual', manual); }
  const missing = data.s.filter(s => s.o && !manual.includes(s.k)).map(s => s.k);
  if (missing.length){ manual = manual.concat(missing); store.set('manual', manual); }
  if (!recent){ recent = Object.keys(visits).sort((a,b) => visits[b] - visits[a]).slice(0, 30); store.set('recent', recent); }
}
function manualIndex(s){ const i = manual ? manual.indexOf(s.k) : -1; return i < 0 ? 1e9 : i; }

function cmp(c){
  // Needs you: the one that has waited longest first, so going down the list is a loop (a
  // session that needs you again goes to the end). Then busy ones, then the rest, newest first.
  const rank = s => heldNeeds(s) ? 0 : stateOf(s) === 'working' ? 1 : 2;
  const since = s => needsMemo[s.k]?.since || s.nsn || s.fa || s.la || 0;
  // Priority sessions (marked, or in a priority column of the Board) come first in every sort.
  const first = f => (a,b) => (b.pri ? 1 : 0) - (a.pri ? 1 : 0) || f(a,b);
  if (c.sort === 'visited') return first((a,b) => (visits[b.k]||0) - (visits[a.k]||0) || (b.la||0) - (a.la||0));
  if (c.sort === 'active') return first((a,b) => (b.la||0) - (a.la||0));
  if (c.sort === 'name') return first((a,b) => a.n.localeCompare(b.n));
  if (c.sort === 'manual') return first((a,b) => manualIndex(a) - manualIndex(b));
  return first((a,b) => rank(a) - rank(b) || (rank(a) === 0 ? since(a) - since(b) : (b.la||0) - (a.la||0)));
}

function rowsFor(ci){
  ensureOrders();
  const c = colState[ci];
  const all = data.s.filter(s => !isPin(s) && inDir(c, s) && loginOk(s));
  const whereOk = s => c.where === 'any' || (c.where === 'here' ? (s.o && s.be === 'ghostty') : c.where === 'cmux' ? (s.o && s.be !== 'ghostty') : !s.o);
  // (The Parked chip is gone: parked sessions are under Not running.)
  if (c.filter === 'parked'){ c.filter = 'all'; c.where = 'off'; }
  if (c.where === 'off'){
    // Not running: closed (and parked) sessions you did not archive. They stay until you do.
    const off = all.filter(s => !s.o && !s.el && !s.ar).sort((a,b) => (b.ca||b.la||0) - (a.ca||a.la||0));
    return off.length ? off.map(s => ({s})) : [{empty:'Nothing here. A session you close stays here until you archive it.'}];
  }
  if (c.where === 'archive'){
    // We're done with these. Clicking one resumes it and takes it out of the Archive.
    const ar = all.filter(s => s.ar && !s.o && !s.el).sort((a,b) => (b.aa||0) - (a.aa||0));
    return ar.length ? ar.map(s => ({s})) : [{empty:'Nothing in the Archive. Right-click a session and choose Archive when you are done with it.'}];
  }
  const open = all.filter(s => s.o && whereOk(s));
  const shown = open.filter(s => c.filter === 'all' || (c.filter === 'needs' ? heldNeeds(s) : c.filter === 'done' ? isFinished(s) : stateOf(s) === 'working'));
  const out = [];
  if (c.group === 'none'){
    shown.sort(cmp(c)).forEach(s => out.push({s}));
  } else {
    const groups = new Map();
    for (const s of shown){ const g = groupKey(c, s); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(s); }
    const order = data.classes || [];
    [...groups.keys()].sort((a,b) => ((order.indexOf(a)+1)||99) - ((order.indexOf(b)+1)||99) || a.localeCompare(b)).forEach(g => {
      const list = groups.get(g).sort(cmp(c));
      out.push({h:g, n:list.length});
      if (!folded[g]) list.forEach(s => out.push({s}));
    });
  }
  if (!shown.length) out.push({empty: c.filter === 'needs' ? 'Nothing needs you right now.' : c.filter === 'done' ? 'No session has finished yet.' : 'Nothing here.'});
  if (c.filter !== 'all'){
    const inList = new Set(shown.map(s => s.k));
    const byKey = new Map(open.map(s => [s.k, s]));
    const rec = (recent || []).map(k => byKey.get(k)).filter(s => s && !inList.has(s.k)).slice(0, 6);
    // Not part of the ⌘↑ ⌘↓ loop: that goes round the list above only.
    if (rec.length){ out.push({h:'Recently visited', n:rec.length}); if (!folded['Recently visited']) rec.forEach(s => out.push({s, aside: true})); }
  }
  // Running in another terminal (cmux): listed so you can find them and move them here.
  // Ordered by when Switchboard first saw them there, so rows do not move under the mouse.
  const away = all.filter(s => s.el).sort((a,b) => (b.ca||0) - (a.ca||0) || a.k.localeCompare(b.k));
  if (away.length && c.filter === 'all'){ out.push({h:'Running elsewhere', n:away.length}); if (!folded['Running elsewhere']) away.forEach(s => out.push({s})); }
  if (c.where !== 'any') return out;
  // Not running: closed (and parked) and not archived. They stay until you archive them.
  const closed = all.filter(s => !s.o && !s.ar && !s.el).sort((a,b) => (b.ca||b.la||0) - (a.ca||a.la||0));
  if (closed.length){ out.push({h:'Not running', n:closed.length}); if (!folded['Not running']) closed.forEach(s => out.push({s})); }
  // Done (✓ in the panel): closed for good, kept here. Clicking one resumes it and takes it out.
  const archive = all.filter(s => s.ar && !s.o && !s.el).sort((a,b) => (b.aa||0) - (a.aa||0));
  if (archive.length){ out.push({h:'Archive', n:archive.length}); if (!folded['Archive']) archive.forEach(s => out.push({s})); }
  return out;
}

// A parked session under the Parked chip: a full card, so you see what it needs from you.
function parkedHTML(s){
  const line = s.ns || s.t || s.sd || '';
  return `<div class="item" data-k="${esc(s.k)}" title="Parked for later. Click to resume it here.">
    <span class="ico" style="color:var(--muted)">${ic('pause',14,2.2)}</span>
    <span class="body">
      <span class="top"><span class="name">${esc(s.n)}</span><span class="age">${ago(s.ca || s.la)}</span></span>
      <span class="line"><span class="word" style="color:var(--muted)">Parked</span>${line ? ' · ' + esc(line) : ''}</span>
      <span class="meta"><span>${ic('folder',10,2.2)} ${esc(s.cwd || '~')}</span>${s.br && s.br !== 'master' ? '<span>· ⎇ ' + esc(s.br) + '</span>' : ''}</span>
    </span></div>`;
}

// The session's Board column (⌘B): a dot in the column's color and the column's name.
function bkHTML(s){
  const b = s.bk;
  return b ? `<span class="bk" style="--col:var(--c-${esc(b.c)})" title="On the Board (⌘B) in ${esc(b.n)}. Right-click › Move to column to move it."><i></i>${esc(b.n)}</span>` : '';
}

function itemHTML(s, ci){
  if ((s.o && s.be !== 'ghostty') || s.el){
    // Running in another terminal (cmux) or the Claude app: one line. A click asks, then moves it here.
    const working = stateOf(s) === 'working', app = s.be === 'claude-app', there = s.m && !s.o;
    return `<div class="else" data-k="${esc(s.k)}" title="${there ? `Runs on ${esc(s.m)}, with no terminal here. Click to show it here.` : app ? 'Runs in the Claude app. Click to move it here.' : 'Running in another terminal (cmux or another app). Click to move it here.'}">
      <span class="dot">${working ? ic('spin',11,2.4,'spin') : '<i></i>'}</span>
      <span class="nm">${esc(s.n)}</span>${bkHTML(s)}<span class="tag">${there ? 'on ' + esc(s.m) : app ? 'Claude app' : 'elsewhere'}</span>
      <span class="age">${ago(s.la)}</span></div>`;
  }
  if (!s.o){
    const L = LOOK[stateOf(s)] || LOOK.closed;
    // A session from the Claude app that was never opened here: its last wrap-up from the app.
    const app = s.be === 'claude-app';
    return `<div class="old" data-k="${esc(s.k)}" title="${s.ar ? 'In the Archive. Click to resume it here (it leaves the Archive).' : app ? 'From the Claude app, not running. Click to resume it here.' : s.pk ? 'Parked: its work is on a parked/… branch. Click to resume it here.' : 'Not running. It stays here until you archive it. Click to resume it here.'}">
      <span style="color:var(--faint)">${ic(L[0],11,2)}</span>
      <span class="nm">${esc(s.n)}</span>${bkHTML(s)}${app ? '<span class="tag">Claude app</span>' : ''}<span class="tt">${esc(s.t || s.ns || (app ? s.lm : '') || '')}</span>
      <span class="age">${ago(s.ca || s.la)}</span></div>`;
  }
  const st = stateOf(s), fresh = isNewAnswer(s);
  const L = fresh ? ['bell', st === 'done' ? 'New: done' : 'New answer', 'b-needs', '--needs'] : LOOK[st] || LOOK.info;
  const tip = fresh ? 'New: the agent finished its turn after you last looked. It stays in Needs you until you go to it.' : TIP[st] || '';
  const front = s.sf && s.sf === focusSf;
  // Filled in the column ⌘↑ ⌘↓ follow (or the only one), a border in the other.
  const sel = front && (ci == null || ci === navColOf()), ring = front && !sel;
  const line = st === 'working' ? (s.wl || s.ns) : (s.ns || s.sd || s.t || '');
  const labs = (s.lb || []).map(l => `<span class="lab">#${esc(l)}</span>`).join(' ');
  return `<div class="item${sel ? ' sel' : ''}${ring ? ' sel-ring' : ''}" data-k="${esc(s.k)}">
    <span class="ico" title="${esc(tip)}" style="color:${sel ? 'var(--sel-ink)' : `var(${L[3]})`}">${ic(L[0], 14, 2.2, st==='working'?'spin':'')}</span>
    <span class="body">
      <span class="top">${s.pri ? `<span class="pri" title="Priority: first in every list. Right-click to change it.">${ic('star', 11, 2.4)}</span>` : ''}<span class="name">${esc(s.n)}</span>${bkHTML(s)}
        <span class="age">${ago(s.la)}</span>
      </span>
      <span class="line"><span class="word" title="${esc(tip)}" style="color:${sel ? 'inherit' : `var(${L[3]})`}">${L[1]}</span>${line ? ' · ' + esc(line) : ''}</span>
      <span class="meta">${s.a === 'shell' ? `<span class="dir">${ic('folder',10,2.2)} ${esc(s.cwd)}</span>` : `<span>${ic(LOGIN_ICON[s.lg]||'person',10,2.2)} ${esc(s.lg)}</span>${s.m ? `<span class="mach" title="Runs on ${esc(s.m)}. You see and type in it here.">· ${ic('server',10,2.2)} ${esc(s.m)}</span>` : ''}${s.cwd ? `<span class="dir${s.mv || s.ml ? ' shrink' : ''}" title="${esc(s.cwd)}">· ${ic('folder',10,2.2)} ${esc(s.cwd)}</span>` : ''}${s.mv ? `<span class="mv" title="Moves to ${esc(s.mv)} when its turn is over and you are not looking at it. Right-click › Move to folder to move it now or keep it here.">→ ${esc(s.mv)}</span>` : ''}${s.ml ? `<span class="mv" title="Moves to the ${esc(s.ml)} login when its turn is over (Move all to, on its login card). Right-click its login card to keep it here.">→ ${esc(s.ml)}</span>` : ''}`}${s.be !== 'ghostty' ? '<span>· cmux</span>' : ''}${labs ? '<span>· ' + labs + '</span>' : ''}${s.br && s.br !== 'master' ? '<span class="br" title="' + esc(s.br) + '">· ⎇ ' + esc(s.br) + '</span>' : ''}</span>
    </span></div>`;
}

const AGENT_NAMES = {claude: 'Claude Code', codex: 'Codex', grok: 'Grok', opencode: 'OpenCode', agy: 'Antigravity'};
// The words around a match: \uE000 and \uE001 mark the words you searched for.
function snipHTML(sn){ return esc(sn || '').replace(/\uE000/g, '<mark>').replace(/\uE001/g, '</mark>'); }
// A search result that matched inside its conversation.
function hitHTML(s, tag){
  const br = s.br && s.br !== 'master' && s.br !== 'main' ? s.br : '';
  // Another Mac (synced) first: it may still run there.
  const where = [s.m ? 'changed on ' + esc(s.m) : '', s.cwd ? esc(s.cwd) : '', br ? '⎇ ' + esc(br) : ''].filter(Boolean).join(' · ');
  const tip = s.k.startsWith('conv:') ? 'Click to resume this conversation here, in its own folder.' : s.o ? 'Click to go to it.' : 'Not running. Click to reopen it here.';
  return `<div class="hit" data-k="${esc(s.k)}" title="${tip}">
    <span class="r1"><span class="nm">${esc(s.n)}</span>${tag ? `<span class="tag">${esc(tag)}</span>` : ''}<span class="age">${ago(s.ca || s.la)}</span></span>
    ${s.sn ? `<span class="sn">${snipHTML(s.sn)}</span>` : ''}
    ${where ? `<span class="mt">${where}</span>` : ''}</div>`;
}

// Under the name results: the row that also searches inside every conversation, or (after you
// asked) the conversations that say the words.
function deepHTML(){
  if (!deep) return `<div class="deeprow" data-k="__deep" title="Also look for these words inside every conversation on this Mac: Claude Code, Codex, Grok and OpenCode, also old ones and ones from other Macs (synced)">${ic('find', 13, 2.3)}<span class="t">Search inside all conversations for <b>“${esc(query)}”</b></span><kbd>⌘↩</kbd></div>`;
  const tagOf = s => s.k.startsWith('conv:') ? AGENT_NAMES[s.a] || s.a : s.o ? 'Open now' : s.be === 'claude-app' ? 'Claude app' : s.ar ? 'Archive' : AGENT_NAMES[s.a] || '';
  const ix = ixState && (!ixState.ready || (ixState.busy && ixState.todo > 50));
  return `<div class="group deephead" title="Conversations on this Mac that say the words, apart from the sessions above">Inside conversations ${deepBusy ? '' : `<span class="n">${convTotal}</span>`}</div>
    ${deepBusy ? `<div class="ixnote">${ic('spin', 11, 2.4, 'spin')}<span>Searching inside your conversations…</span></div>` : ''}
    ${!deepBusy && !convHits.length ? `<div class="empty">No ${results.length ? 'other ' : ''}conversation says “${esc(query)}”.</div>` : ''}
    ${convHits.map(s => hitHTML(s, tagOf(s))).join('')}
    ${convTotal > convHits.length ? `<div class="ixnote">Showing the newest ${convHits.length} of ${convTotal}. Add a word to find fewer.</div>` : ''}
    ${!deepBusy && ix ? `<div class="ixnote">${ic('dots',11,2.4)}<span>Reading your conversations${ixState.todo ? ` (${ixState.done.toLocaleString()} of ${ixState.todo.toLocaleString()})` : ''}. Some do not show yet.</span></div>` : ''}`;
}

function seg(id, options, value, onPick){
  const el = $(id);
  el.innerHTML = options.map(([v, label]) => `<button aria-pressed="${v===value}" data-v="${v}">${label}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (b) onPick(isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v); };
}

// A column can show the sessions of one folder (and its subfolders): c.dir, "~/Brain".
const inDir = (c, s) => !c.dir || s.cwd === c.dir || (s.cwd || '').startsWith(c.dir + '/');

// The folders sessions run in, the most used first: [[folder, sessions], ...].
function colFolders(){
  const n = new Map();
  for (const s of data.s) if (!isPin(s) && s.cwd) n.set(s.cwd, (n.get(s.cwd) || 0) + 1);
  return [...n].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

function colControls(ci){
  const c = colState[ci], count = f => data.s.filter(s => s.o && !isPin(s) && inDir(c, s) && loginOk(s) && f(s)).length;
  const fchip = (v, label, n, tip) => `<button class="fchip" data-f="${v}" aria-pressed="${c.filter===v}"${tip ? ` title="${tip}"` : ''}>${label} ${n}</button>`;
  const pills = (key, opts) => `<span class="seg">${opts.map(([v,l]) => `<button data-${key}="${v}" aria-pressed="${c[key]===v}">${l}</button>`).join('')}</span>`;
  const wcount = w => data.s.filter(s => !isPin(s) && inDir(c, s) && loginOk(s)).filter(s => w === 'here' ? ((s.o && s.be === 'ghostty') || s.el) : w === 'cmux' ? (s.o && s.be !== 'ghostty') : w === 'off' ? (!s.o && !s.el && !s.ar) : w === 'archive' ? (!s.o && !s.el && s.ar) : true).length;

  // controls are for running sessions, so they are not shown there.
  const stopped = c.where === 'off' || c.where === 'archive';
  return `<div class="ctrl">
    <div class="chips" title="Where it runs">${wchip('here','Running')}${wchip('off','Not running')}${wchip('archive','Archive')}${wchip('any','Anywhere')}</div>
    ${stopped ? '' : `<div class="chips">${fchip('needs','Needs you',count(wantsYou),'The agent asks you something, or has a new answer you have not looked at yet')}${fchip('working','Busy',count(s=>stateOf(s)==='working'))}${fchip('done','Finished',count(isFinished),'The agent finished what you asked: Done, Answered, or marked as handled')}${fchip('all','All',count(()=>true))}</div>
    <div class="row" title="Group">${pills('group',[['none','Flat'],['class','Class'],['login','Login'],['folder','Dir']])}</div>`}
    <div class="row"><button class="colfolder${c.dir ? ' on' : ''}" data-colfolder="${ci}" title="${c.dir ? 'Only sessions in ' + esc(c.dir) + '. Click to pick another folder or all of them.' : 'Only sessions in one folder: click to pick it.'}">${ic('folder',10,2.2)}<span>${esc(c.dir || 'All folders')}</span>${ic('chev',8,2.6)}</button></div>
    ${stopped ? '' : `<div class="row" title="Sort. Manual: drag rows to put them in your order.">${pills('sort',[['needs','Needs'],['visited','Visited'],['active','Active'],['manual','Manual'],['name','A–Z']])}</div>`}
  </div>`;
}

// Folders to offer for new sessions: where your sessions run most, plus the current one.
function folderChoices(machine){
  // This Mac: the folders sessions start in (the repository, not its work trees, which
  // the session finds by itself), as the app works them out.
  if (!machine && data && data.folders){
    const list = data.folders.slice();
    if (!list.includes(newCwd)) list.push(newCwd);
    return list;
  }
  const n = new Map();
  for (const s of (data && data.s) || []) if (s.cwd && !s.rm && (s.m || null) === (machine || null)) n.set(s.cwd, (n.get(s.cwd) || 0) + 1);
  const list = [...n.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]).slice(0, 8);
  for (const f of ['~/Simplero', newCwd]) if (!list.includes(f)) list.push(f);
  return list;
}

// ---------- Pinned ----------
function pinTile(s, i){
  const st = stateOf(s), L = LOOK[st] || LOOK.info;
  const front = s.o && s.sf && s.sf === focusSf;
  let icon = L[0], color = L[3], word = L[1], rest = s.ns || s.t || '', tip = TIP[st] || '';
  if (s.el && s.be === 'claude-app'){ icon = 'dots'; color = '--muted'; word = 'Elsewhere'; rest = 'in the Claude app'; tip = 'Runs in the Claude app. Click to move it here.'; }
  else if (s.el && s.m){ icon = 'dots'; color = '--muted'; word = 'Elsewhere'; rest = 'on ' + s.m; tip = `Runs on ${s.m}, with no terminal here. Click to show it here.`; }
  else if (s.el){ icon = 'dots'; color = '--muted'; word = 'Elsewhere'; rest = 'in another terminal'; tip = 'Runs in another terminal (cmux or another app). Click to move it here.'; }
  else if (!s.o){ icon = 'moon'; color = '--faint'; word = 'Not running'; rest = s.a === 'shell' ? s.cwd : ''; tip = 'Not running. Click to start it.'; }
  else if (s.a === 'shell'){ word = ''; rest = s.cwd; }
  else if (st === 'working'){ rest = s.wl || s.ns || ''; }
  const key = i < 9 ? `⌃${i + 1}` : '';
  const title = `${s.n}${tip ? ' · ' + tip : ''}${s.o && s.ns && s.a !== 'shell' ? '\n' + s.ns : ''}${key ? `\n${key} opens it. ${key} again takes you back.` : ''}\nDrag to change the order. Right-click to unpin or turn it off.`;
  const small = (word ? `<span class="w" style="color:${front ? 'inherit' : `var(${color === '--faint' ? '--muted' : color})`}">${word}</span>` : '') + (word && rest ? ' · ' : '') + esc(rest);
  return `<button class="pin${front ? ' sel' : ''}${s.o ? '' : ' off'}" data-k="${esc(s.k)}" title="${esc(title)}">
    <span class="pi" style="color:${front ? 'inherit' : `var(${color})`}">${ic(icon, 14, 2.2, st === 'working' && s.o ? 'spin' : '')}</span>
    <span class="pt"><b>${esc(s.n)}</b><small>${small || '&nbsp;'}</small></span>${s.o ? (offArm === s.k
      ? `<span class="poff arm" data-pinoff="${esc(s.k)}" role="button" aria-label="Click again to turn off ${esc(s.n)}" title="Click again to turn it off. Move away or press Esc to keep it running.">${ic('power', 12, 2.2)}Turn off?</span>`
      : `<span class="poff" data-pinoff="${esc(s.k)}" role="button" aria-label="Turn off ${esc(s.n)}" title="Turn off: it stops and frees its memory. The pin stays; click the pin to start it again. Asks first.">${ic('power', 13, 2.2)}</span>`) : ''}${key && offArm !== s.k ? `<kbd>${key}</kbd>` : ''}</button>`;
}
// Turn off asks first: the first click arms the button ("Turn off?"), the second click turns it off.
// Leaving the pin, Esc or 4 seconds puts it back.
let offArm = null, offArmTimer = 0;
function setOffArm(k){
  clearTimeout(offArmTimer);
  if (offArm === k) return;
  offArm = k;
  if (k) offArmTimer = setTimeout(() => setOffArm(null), 4000);
  renderPins();
}
document.addEventListener('mouseout', e => {
  if (!offArm) return;
  const pin = e.target.closest && e.target.closest('#pins .pin[data-k]');
  if (pin && pin.isConnected && pin.dataset.k === offArm && !pin.contains(e.relatedTarget)) setOffArm(null);
});
document.addEventListener('keydown', e => { if (offArm && e.key === 'Escape') setOffArm(null); });
function renderPins(){
  const el = $('#pins');
  const pins = data.s.filter(isPin).sort((a, b) => a.pn - b.pn);

// Drag a pin to change the order (left and right, and across lines).
let pinDrag = null;
function endPinDrag(){
  const d = pinDrag;
  pinDrag = null;
  if (!d || !d.on) return;
  d.el.classList.remove('dragging');
  document.body.classList.remove('dragging-pins');
  const order = [...document.querySelectorAll('#pins .pin[data-k]')].map(t => t.dataset.k);
  if (order.join(',') !== d.before){
    justDragged = true;
    setTimeout(() => { justDragged = false; }, 0);
    op({op: 'pin_order', keys: order});
  }
}
document.addEventListener('mousedown', e => {
  if (e.target.closest('[data-pinoff]')) return;
  const t = e.button === 0 && e.target.closest('#pins .pin[data-k]');
  if (!t) return;
  pinDrag = {el: t, x0: e.clientX, y0: e.clientY, on: false, before: [...document.querySelectorAll('#pins .pin[data-k]')].map(x => x.dataset.k).join(',')};
});
document.addEventListener('mousemove', e => {
  const d = pinDrag;
  if (!d) return;
  if (!e.buttons){ endPinDrag(); return; }
  if (!d.on){
    if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return;
    d.on = true;
    d.el.classList.add('dragging');
    document.body.classList.add('dragging-pins');
  }
  e.preventDefault();
  for (const t of document.querySelectorAll('#pins .pin[data-k]')){
    if (t === d.el) continue;
    const b = t.getBoundingClientRect();
    if (e.clientX < b.left || e.clientX > b.right || e.clientY < b.top || e.clientY > b.bottom) continue;
    if (e.clientX < b.left + b.width / 2){ if (t.previousElementSibling !== d.el) t.before(d.el); }
    else if (t.nextElementSibling !== d.el) t.after(d.el);
    break;
  }
});

// While you are in another app: did the rows move? (The app then lets a click that brings
// Switchboard back only bring it back, not open the row now under the pointer.)
let awaySig = null;
const rowSig = () => [...document.querySelectorAll('#cols .item[data-k]')].map(r => r.dataset.k + '@' + Math.round(r.getBoundingClientRect().top)).join(',');
// Limit resets left, tidy: "Full week resets: 1, the next ends Dec 10" and the same per
// model ("Fable resets: 3, …"). rs: [label, ends at, usable now, kind] per reset.
function resetLines(rs){
  const day = t => new Date(t).toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
  const groups = [['week', 'Full week resets']];
  for (const r of rs) if (r[3] && r[3] !== 'week' && !groups.some(g => g[0] === r[3])) groups.push([r[3], r[3] === 'other' ? 'Other resets' : r[3] + ' resets']);
  return groups.map(([k, name]) => {
    const g = rs.filter(r => (r[3] || 'week') === k);
    if (!g.length) return k === 'week' && rs.length ? `${name}: none` : '';
    const next = g.map(r => r[1]).filter(Boolean).sort()[0];
    return `${name}: ${g.length}${next ? ', the next ends ' + day(next) : ''}`;
  }).filter(Boolean);
}

// One subscription, as the panel above a session shows it: how much of this week is used,
// a graph of the weekly use over the last 7 days, when the week resets, and the full week
// resets the account has left (↻ 1: one).
function subHTML(d){
  const name = loginName(d), u = (data.use || {})[d] || {}, wk = u.wk, on = loginFilter === d;
  const used = wk && wk.p != null ? wk.p : null;
  const reset = wk && wk.r ? Date.parse(wk.r) / 1000 : null, now = Date.now() / 1000;
  const inT = t => { const x = t - now; return x <= 0 ? 'now' : x < 3600 ? Math.round(x/60) + 'm' : x < 86400 ? Math.round(x/3600) + 'h' : Math.round(x/86400) + 'd'; };
  const W = 60, H = 15;
  let graph = `<svg class="wk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><rect width="${W}" height="${H}" rx="2" fill="var(--bg)"/>`;
  const h = (u.hist || []).filter(x => x[1] != null);
  if (h.length > 1){
    const t0 = Math.max(now - 7 * 86400, h[0][0]), span = Math.max(1, now - t0);
    const pts = h.filter(x => x[0] >= t0).map(x => [x[0], x[1]]);
    if (used != null) pts.push([now, used]);
    graph += `<polyline points="${pts.map(p => ((p[0] - t0) / span * W).toFixed(1) + ',' + (H - 1 - p[1] / 100 * (H - 2)).toFixed(1)).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  }
  graph += '</svg>';
  const rs = u.rs || [], full = rs.filter(r => (r[3] || 'week') === 'week').length;
  // Almost out (98%): Switchboard moves its sessions to the login with room (lroom).
  const out = (data.lfull || []).includes(d), room = LOGINS.includes(data.lroom) ? data.lroom : null;
  const tip = [used == null ? `${name}: usage not known yet.` : `${name}: ${used}% of this week used${reset ? ', resets in ' + inT(reset) : ''}.`,
    ...(u.h5 && u.h5.p != null ? [`${u.h5.p}% of the 5-hour window used.`] : []),
    ...resetLines(rs),
    ...(out && room ? [`Almost out: its Claude sessions move to ${loginName(room)} when their turn is over.`] : out ? ['Almost out, and no other login has room.'] : []),
    ...(!out && (data.lfull || []).length && room === d ? ['Claude sessions of a login that is almost out move here: its week resets first.'] : []),
    ...((data.lmw || {})[d] ? [`${data.lmw[d]} of its sessions move to another login when their turn is over.`] : []),
    on ? 'Click to show the sessions of every login.' : `Click to show only the ${name} sessions.`,
    'Right-click to move all its sessions to another login.'].join('\n');
  return `<button class="subbtn${used != null && used >= 90 ? ' hi' : ''}" data-sub="${d}" aria-pressed="${on}" title="${esc(tip)}">`
    + `<span class="ln"><span class="nm">${on ? ic('check', 9, 3) : ''}${esc(name)}</span>`
    + (full ? `<span class="rs gr" aria-label="${full} full week ${full === 1 ? 'reset' : 'resets'} left">${ic('reset', 9, 2.4)}${full}</span>` : '')
    + `</span><span class="ln">${graph}<span class="pct">${used == null ? '–' : used + '%'}</span>`
    + (reset ? `<span class="rs">${ic('clock', 9, 2.4)}${inT(reset)}</span>` : '') + `</span></button>`;
}

function render(){
  renderNow();
  if (awaySig !== null && rowSig() !== awaySig){ awaySig = null; bridge('movedAway'); }
}
function renderNow(){

  $('#newbtns').innerHTML = `<button class="newbtn big" data-new="" aria-pressed="${nf.open}" title="New Claude session (⌘N): pick the folder and the login. A first message, files and a name are optional. ⌥⌘N: a plain shell."><span class="plus">+</span>New session</button>`

  renderPins();

  const host = $('#cols');

  const scroll = render.lastQuery === query ? [...host.querySelectorAll('.list')].map(l => l.scrollTop) : [];
  render.lastQuery = query;

      ${away.length ? `<div class="group">Running elsewhere <span class="n">${away.length}</span></div>` + away.map(s => itemHTML(s)).join('') : ''}
      ${older.length ? `<div class="group">Older <span class="n">${older.length}</span></div>` + older.map(s => itemHTML(s)).join('') : ''}
      ${deepHTML()}

    </div></div>`;

      r.h ? `<div class="group${folded[r.h] ? ' folded' : ''}" data-fold="${esc(r.h)}"><span class="chev">${ic('chev',10,2.6)}</span>${esc(r.h)} <span class="n">${r.n}</span></div>`
      : r.empty ? `<div class="empty">${esc(r.empty)}</div>` : r.card ? parkedHTML(r.s) : itemHTML(r.s, ci)).join('') + `</div></div>`;
  }
  host.innerHTML = html;
  [...host.querySelectorAll('.list')].forEach((l, i) => { if (scroll[i]) l.scrollTop = scroll[i]; });
  applyCursor(false);
  const navKey = nav.join(',');
  if (navKey !== render.lastNav){ render.lastNav = navKey; bridge('nav', {keys: nav}); }
}

// ---------- new session: first message, files, name ----------
// "+ login" opens this form under the buttons. Enter starts the session (with the login's

const LOGIN_NAMES = {'~/.claude':'simplero.com','~/.claude-ccl':'corre.li','~/.claude-ccm':'correli.me'};
const loginName = d => data?.spares?.[d]?.lg || LOGIN_NAMES[d] || d;

function nfStatus(){
