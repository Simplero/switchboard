    return `<button class="newbtn" data-nf="login" data-login="${d}" aria-pressed="${nf.login === d}" title="Start it with the ${esc(n)} login">${ic(LOGIN_ICON[n] || 'person', 11, 2.2)}${esc(n)}${nf.login === d ? ' ' + ic('check', 10, 2.8) : ''}</button>`; }).join('');
  const ms = machineList();
  if (nf.machine && !ms.some(x => x.n === nf.machine)) nf.machine = '';
  $('#nfmachrow').hidden = !ms.length || other;
  $('#nfmachines').innerHTML = [['', 'This Mac', 'laptop'], ...ms.map(x => [x.n, x.n, 'server'])].map(([v, n, icon]) =>
    `<button class="newbtn" data-nf="machine" data-machine="${esc(v)}" aria-pressed="${nf.machine === v}" title="${v ? `Claude runs on ${esc(n)}, next to its files. You see and type in it here.` : 'Claude runs on this Mac.'}">${ic(icon, 11, 2.2)}${esc(n)}${nf.machine === v ? ' ' + ic('check', 10, 2.8) : ''}</button>`).join('');
  let rd;
  if (other){
    rd = `<span class="rd">${ic('term', 11, 2.4)} ${esc(agentName(nf.agent))} starts when you press Enter</span>`;
  } else if (nf.machine){
    const m = ms.find(x => x.n === nf.machine) || {};
    rd = m.ok === true ? `<span class="rd on">${ic('server', 11, 2.4)} Runs on ${esc(nf.machine)}</span><span>· Claude starts there when you press Enter</span>`
      : m.ok === false ? `<span class="rd bad">${ic('warn', 11, 2.4)} ${esc(m.msg || nf.machine + ' does not answer.')}</span>`
      : `<span class="rd">${ic('dots', 11, 2.4)} Looking for ${esc(nf.machine)}…</span>`;
  } else {
    const sp = data?.spares?.[nf.login];
    rd = sp?.ready ? `<span class="rd on">${ic('bolt', 11, 2.4)} Claude is ready</span>`
      : `<span class="rd">${ic('dots', 11, 2.4)} Starting Claude…</span>`;
  }
  $('#nfsub').innerHTML = rd;
}
function nfFiles(){
  $('#nffiles').innerHTML = nf.files.map(p => `<span class="file" title="${esc(p)}">${ic('clip', 11, 2.2)}<span>${esc(baseName(p))}</span>` +
    `<button data-nf="rm" data-path="${esc(p)}" title="Remove" aria-label="Remove ${esc(baseName(p))}">×</button></span>`).join('');
}
function addFiles(paths){
  for (const p of paths || []) if (p && !nf.files.includes(p)) nf.files.push(p);
  nfFiles();
  nfMsg.focus();
}
function nfGrow(){ nfMsg.style.height = 'auto'; nfMsg.style.height = Math.min(nfMsg.scrollHeight + 2, 240) + 'px'; }
function openNew(login){
  const was = nf.open;
  nf.open = true; nf.login = login || (was ? nf.login : '') || lastLogin();
  if (!was){ nf.machine = lastMachine(); nf.agent = login ? 'claude' : lastAgent(); }
  login = nf.login;
  const r = $('#newbtns').getBoundingClientRect();
  $('#newform').style.top = (r.bottom + 6) + 'px';
  $('#scrim').style.top = (r.bottom + 2) + 'px';
  $('#newform').hidden = false; $('#scrim').hidden = false;
  nfStatus(); nfFiles(); nfGrow(); render();
  nfWarm();   // Claude starts now, while you write (on this Mac)
  if (!was || document.activeElement !== nfName) nfMsg.focus();
}
// keep: the draft stays (Esc, ×, a click outside). Starting clears it.
function closeNew(giveBack){
  if (!nf.open) return;
  nf.open = false;
  $('#newform').hidden = true; $('#scrim').hidden = true;
  $('#newform').classList.remove('drop');
  bridge('newWarm', {login: null});
  render();
  if (giveBack) bridge('blur');
}
function submitNew(){
  if (!nf.open) return;
  nf.sent = {text: nfMsg.value, name: nfName.value, files: nf.files.slice()};
  op({op:'new', agent: nf.agent, login: nf.login, machine: nfMachine() || null, cwd: newCwd, prompt: nfMsg.value, name: nfName.value.trim(), files: nf.files.slice()});
  store.set('newLogin', nf.login);
  store.set('newMachine', nf.machine);
  store.set('newAgent', nf.agent);
  nfMsg.value = ''; nfName.value = ''; nf.files = [];
  // The next session starts in ~/Simplero again.
  if (newCwd !== HOME_FOLDER){ newCwd = HOME_FOLDER; if (!nfMachine()) bridge('newFolder', {cwd: newCwd}); }
  nfFiles(); nfGrow();
  closeNew(false);   // the app puts the keyboard in the new session
}
function nfKey(e){
  if (e.key === 'Escape'){ e.preventDefault(); closeNew(true); return; }
  // (keyCode 229: Enter that ends an input-method composition, not a send)
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229 && (e.target === nfName || !e.shiftKey)){ e.preventDefault(); submitNew(); }
}
nfMsg.addEventListener('keydown', nfKey);
nfName.addEventListener('keydown', nfKey);
nfMsg.addEventListener('input', nfGrow);
// A pasted screenshot or copied files: attached by their paths (the app saves a picture as a file).
nfMsg.addEventListener('paste', async e => {
  const cd = e.clipboardData;
  if (!cd || ![...cd.types].includes('Files')) return;
  e.preventDefault();
  const text = cd.getData('text/plain');
  const r = await ask('pasteFiles');
  if (r && r.paths && r.paths.length) addFiles(r.paths);
  else if (text) document.execCommand('insertText', false, text);
});
// Files dragged over the page: only the open form takes them. Never let a drop load the file
// into the page.
document.addEventListener('dragover', e => {
  if (![...(e.dataTransfer?.types || [])].includes('Files')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = nf.open ? 'copy' : 'none';
  if (nf.open) $('#newform').classList.add('drop');
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) $('#newform').classList.remove('drop'); });
document.addEventListener('drop', e => { e.preventDefault(); $('#newform').classList.remove('drop'); });

// ---------- Manual order: drag rows ----------
// In a column sorted "Manual", press a row and move it up or down; it moves within its
// group. The order is saved and both columns use it. A short press still opens the session.
let drag = null, renderLater = false, justDragged = false, pressing = false, pressTimer;
const groupOf = el => { for (let p = el.previousElementSibling; p; p = p.previousElementSibling) if (p.classList.contains('group')) return p.dataset.fold || p.textContent; return ''; };
document.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  pressing = true;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(endPress, 4000);   // last resort: never hold the list longer
  if (query || !manual) return;
  const row = e.target.closest('.col.manual .item[data-k]');
  if (!row || !manual.includes(row.dataset.k)) return;
  drag = {row, list: row.closest('.list'), y0: e.clientY, y: e.clientY, on: false, group: groupOf(row),
          before: [...row.closest('.list').querySelectorAll('.item[data-k]')].map(r => r.dataset.k).join(',')};
});
function dragMove(y){
  const d = drag;
  d.y = y;
  const rows = [...d.list.querySelectorAll('.item[data-k]')]
    .filter(r => r !== d.row && groupOf(r) === d.group && manual.includes(r.dataset.k));
  for (const r of rows){
    const b = r.getBoundingClientRect();
    if (y < b.top || y > b.bottom) continue;
    if (y < b.top + b.height / 2){ if (r.previousElementSibling !== d.row) r.before(d.row); }
    else if (r.nextElementSibling !== d.row) r.after(d.row);
    break;
  }
}
document.addEventListener('mousemove', e => {
  // The button went up outside the page (the mouse-up never came): end the press, or the
  // list would stop updating.
  if (pressing && !e.buttons && !drag) endPress();
  if (!drag) return;
  if (!e.buttons){ endDrag(); return; }   // released outside the page
  if (!drag.on){
    if (Math.abs(e.clientY - drag.y0) < 8) return;
    drag.on = true;
    drag.row.classList.add('dragging');
    document.body.classList.add('dragging-rows');
    // Near the top or bottom edge of the list: scroll it.
    drag.timer = setInterval(() => {
      if (!drag) return;
      const l = drag.list.getBoundingClientRect(), edge = 36;
      const v = drag.y < l.top + edge ? -1 : drag.y > l.bottom - edge ? 1 : 0;
      if (v){ drag.list.scrollTop += v * 10; dragMove(drag.y); }
    }, 16);
  }
  e.preventDefault();
  dragMove(e.clientY);
});
function endDrag(){
  const d = drag;
  drag = null;
  if (!d) return;
  clearInterval(d.timer);
  if (d.on){
    d.row.classList.remove('dragging');
    document.body.classList.remove('dragging-rows');
    // The rows of this list in their new order take the places these sessions had.
    const order = [...d.list.querySelectorAll('.item[data-k]')].map(r => r.dataset.k).filter(k => manual.includes(k));
    const at = order.map(k => manual.indexOf(k)).sort((a, b) => a - b);
    at.forEach((pos, i) => { manual[pos] = order[i]; });
    store.set('manual', manual);
    // Only a row that really moved swallows the click; a press that wobbled still opens it.
    if (order.join(',') !== d.before){
      justDragged = true;
      setTimeout(() => { justDragged = false; }, 0);
    }
  }
  // After the click (if any) ran: a list rebuilt now would swallow it.
  if (d.on || renderLater) setTimeout(() => { renderLater = false; render(); }, 0);
}
// The press ends after its click ran; then the list may change again.
function endPress(){
  clearTimeout(pressTimer);
  if (!pressing) return;
  setTimeout(() => {
    pressing = false;
    if (renderLater && !drag){ renderLater = false; render(); }
  }, 0);
}
document.addEventListener('mouseup', () => { if (pinDrag) endPinDrag(); if (drag) endDrag(); endPress(); });
window.addEventListener('blur', () => { if (pinDrag) endPinDrag(); if (drag) endDrag(); endPress(); });

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target;
  const off = t.closest('[data-pinoff]');
  if (off){
    e.stopPropagation();
    const k = off.dataset.pinoff;
    if (offArm === k){ setOffArm(null); op({op:'pin_off', k}); } else setOffArm(k);
    return;
  }
  const ack = t.closest('[data-ack]'); if (ack){ e.stopPropagation(); op({op:'ack', k: ack.dataset.ack}); return; }
  const send = t.closest('[data-send]'); if (send){ op({op:'send', k: send.dataset.k, text: send.dataset.send}); return; }
  if (t.closest('#navBack')){ bridge('histBack'); return; }
  if (t.closest('#navFwd')){ bridge('histForward'); return; }
  if (t.closest('#navHist')){ const r = $('#navHist').getBoundingClientRect(); bridge('histMenu', {x: r.left, y: r.bottom + 4}); return; }
  if (t.closest('#scrim')){ closeNew(); return; }
  const nfb = t.closest('[data-nf]');
  if (nfb){
    if (nfb.dataset.nf === 'go') submitNew();
    else if (nfb.dataset.nf === 'cancel') closeNew(true);
    else if (nfb.dataset.nf === 'folder'){ const r = nfb.getBoundingClientRect(); bridge('folderMenu', {folders: folderChoices(nfMachine()), current: newCwd, machine: nfMachine() || '', x: r.left, y: r.bottom + 4}); }
    else if (nfb.dataset.nf === 'login' && nfb.dataset.login !== nf.login){
      nf.login = nfb.dataset.login; store.set('newLogin', nf.login);
      nfWarm();   // that login's Claude starts now
      nfStatus(); render(); nfMsg.focus();
    }
    else if (nfb.dataset.nf === 'agent' && nfb.dataset.agent !== nf.agent){
      nf.agent = nfb.dataset.agent; store.set('newAgent', nf.agent);
      if (!nfMachine()) bridge('newFolder', {cwd: newCwd});
      nfWarm();
      nfStatus(); render(); nfMsg.focus();
    }
    else if (nfb.dataset.nf === 'machine' && nfb.dataset.machine !== nf.machine){
      nf.machine = nfb.dataset.machine; store.set('newMachine', nf.machine);
      if (!nf.machine) bridge('newFolder', {cwd: newCwd});
      nfWarm();
      nfStatus(); render(); nfMsg.focus();
    }
    else if (nfb.dataset.nf === 'rm'){ nf.files = nf.files.filter(f => f !== nfb.dataset.path); nfFiles(); $('#nfmsg').focus(); }
    return;
  }
  if (t.closest('#newform')) return;
  const nb = t.closest('[data-new]'); if (nb){ openNew(nb.dataset.new); return; }
  if (t.closest('[data-newq]')){ newFromQuery(); return; }
  const sb = t.closest('[data-sub]');
  if (sb){ loginFilter = loginFilter === sb.dataset.sub ? null : sb.dataset.sub; store.set('loginFilter', loginFilter); render(); return; }
  const cf = t.closest('[data-colfolder]');
  if (cf){
    const ci = +cf.dataset.colfolder, r = cf.getBoundingClientRect();
    bridge('colFolderMenu', {col: ci, folders: colFolders(), current: colState[ci].dir || '', x: r.left, y: r.bottom + 4});
    return;
  }
  const rs = t.closest('[data-resume]');
  if (rs){
    op({op:'resume_id', id: rs.dataset.resume, login: rs.dataset.login || null});
    setTimeout(() => { clearSearch(); render(); }, 800);
    return;
  }
  const fold = t.closest('[data-fold]'); if (fold){ const g = fold.dataset.fold; folded[g] = !folded[g]; store.set('folded', folded); render(); return; }
  const col = t.closest('[data-col]');
  if (col){
    const c = colState[+col.dataset.col];
    const f = t.closest('[data-f]'), g = t.closest('[data-group]'), so = t.closest('[data-sort]'), w = t.closest('[data-w]');
    if (f || g || so || w){
      if (f) c.filter = f.dataset.f; if (g) c.group = g.dataset.group; if (so) c.sort = so.dataset.sort; if (w) c.where = w.dataset.w;
      store.set('col' + col.dataset.col, c); render(); return;
    }
  }
  const row = t.closest('[data-k]');
  if (justDragged) return;
  if (row && row.dataset.k === '__deep'){ runDeep(true); return; }
  if (row && data){
    // A session whose key changed while the row was pressed (its conversation id arrived) has the old key as `was`.
    const k = row.dataset.k;
    const s = data.s.find(x => x.k === k) || results.find(x => x.k === k) || convHits.find(x => x.k === k) || data.s.find(x => x.was === k);
    if (s){ if (!query && col) setNavCol(+col.dataset.col); openSession(s); }
  }
});
document.addEventListener('contextmenu', e => {
  // A login card: Move all to (its sessions go to another login).
  const sub = e.target.closest('.subbtn[data-sub]');
  if (sub){ e.preventDefault(); bridge('subMenu', {d: sub.dataset.sub}); return; }
  const row = e.target.closest('[data-k]');
  if (row && (row.dataset.k.startsWith('conv:') || row.dataset.k === '__deep' || row.dataset.k === '__new')){ e.preventDefault(); return; }
  if (row){ e.preventDefault(); bridge('menu', {k: row.dataset.k}); }
});
setInterval(() => render(), 30000);   // keep "5m ago" fresh
bridge('ready');
bridge('newFolder', {cwd: newCwd});
</script>
