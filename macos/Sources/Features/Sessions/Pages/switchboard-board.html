<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Board</title>
<link rel="stylesheet" href="switchboard-tools.css">
<style>
html,body{margin:0;height:100%;background:var(--bg)}
body{overflow:hidden}
.board{height:100%;min-height:0}
.board__cols{flex:1;min-height:0;align-items:stretch}
.col{max-height:100%;overflow-y:auto;overflow-x:visible;padding-top:0}
.col > *{flex-shrink:0}
.col__head{position:sticky;top:0;z-index:3;cursor:grab;background:var(--sunk)}
.col__head .name{outline:none;border-radius:4px;padding:0 3px}
.col__head .name[contenteditable="true"]{background:var(--surface);cursor:text;text-transform:none;letter-spacing:0}
.col__more{opacity:0;border:0;background:none;color:var(--muted);font:700 14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;cursor:pointer;padding:0 4px;border-radius:5px}
.col:hover .col__more,.col__more:focus{opacity:1}
.col__more:hover{color:var(--ink);background:var(--line2)}
.col.drop-target{outline:2px dashed var(--col);outline-offset:-2px}
.col.collapsed{cursor:pointer}
.col__empty{font-size:13.5px;color:var(--muted);text-align:center;padding:14px 6px;border:1.5px dashed color-mix(in srgb,var(--col) 35%,transparent);border-radius:8px}
.card{cursor:pointer}
.card.dragging{opacity:.35}
.ghost{position:fixed;z-index:60;pointer-events:none;rotate:1.5deg;box-shadow:0 12px 30px rgba(0,0,0,.35);opacity:.95}
.col-dragging{opacity:.6;outline:2px dashed var(--col);outline-offset:-2px}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.card .card__more{position:absolute;top:4px;right:6px;opacity:0;border:0;background:none;color:var(--muted);font:800 15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;cursor:pointer;border-radius:5px;padding:0 5px;z-index:3}
.card:hover .card__more,.card__more:focus{opacity:1}
.card__more:hover{background:var(--line2);color:var(--ink)}
.drop-line{height:3px;border-radius:2px;background:var(--col);margin:-4px 4px}
.chip{cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{filter:brightness(1.15)}
textarea.note-edit,input.line-edit{font:13px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink);background:var(--surface);border:1.5px solid var(--needs);border-radius:6px;padding:6px 8px;resize:vertical;width:100%;box-sizing:border-box}
input.line-edit{border-color:var(--accent)}
.edit-hint{font-size:11px;color:var(--muted)}
.pop{position:fixed;z-index:50;min-width:200px;max-width:320px;max-height:70vh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:10px;box-shadow:0 0 0 1px var(--line2),0 12px 32px oklch(0% 0 0/40%);padding:5px;font:13px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:6px 9px;border-radius:6px;cursor:pointer}
.pop button:hover,.pop button:focus{background:color-mix(in srgb,var(--accent) 22%,transparent);outline:none}
.pop .cap{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 9px 3px}
.pop hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
.pop .sw{display:flex;gap:6px;padding:4px 9px 6px;flex-wrap:wrap}
.pop .sw button{width:22px;height:22px;padding:0;border-radius:50%;background:var(--c);justify-content:center;color:var(--surface);font-weight:900}
.pop .check{width:14px;flex:none;text-align:center}
.bsearch{display:flex;align-items:center;gap:7px;flex:0 1 380px;min-width:180px;height:32px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:0 9px}
.bsearch:focus-within{border-color:var(--accent)}
.bsearch svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}
.bsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font:14.5px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink)}
.bsearch kbd{font:600 11px ui-monospace,SFMono-Regular,monospace;color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.bfilters{display:flex;gap:5px;flex:none}
.bf{border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:0 10px;height:30px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.bf:hover{border-color:var(--accent)}
.bf.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.board__hint{margin-right:auto;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.board__add{white-space:nowrap;flex:none;cursor:pointer}
.board__bar .board__spacer{display:none}
/* The state, as in the sidebar: its icon (the spinner while it works) and its word. */
.state svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spin{animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.state--new{color:var(--needs);background:var(--needs-soft)}
/* A card reads like a sidebar row: the state's icon on the left (the spinner while it works),
   the name, then the state's word and what it does now. The name keeps its size; the rest is smaller. */
.board .card{flex-direction:row;align-items:flex-start;gap:8px;padding:9px 11px}
.card__ico{flex:none;width:14px;display:flex;justify-content:center;padding-top:4px}
.card__ico svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card__line{font-size:13px;line-height:1.4;color:var(--ink2)}
.card__line .word{font-weight:700}
.card__line b{font-weight:700}
.board .card__title{font-size:13.5px;font-weight:500;color:var(--ink2);line-height:1.4}
.board .card__note{font-size:12.5px}
.board .card__meta{font-size:11.5px}
.board .chip{font-size:12px;height:22px}
.board .chip svg{width:11px;height:11px}
/* The keyboard's place: a thick ring and a marker on the left, not color alone. */
.card{scroll-margin:48px 0 8px}
.card.kb,.col__head.kb,.col.collapsed.kb{box-shadow:0 0 0 2.5px var(--accent);border-radius:9px}
.card.kb::before,.col__head.kb::after{content:"";position:absolute;left:-8px;top:50%;translate:0 -50%;border:6px solid transparent;border-left-color:var(--accent)}
.col__head.kb::after{left:-10px}
.col.collapsed.kb{position:relative}
.prio{width:12px;height:12px;flex:none;fill:var(--needs);stroke:var(--needs);stroke-width:2;stroke-linejoin:round;vertical-align:-1px;margin-right:4px}
.col__pin{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;margin-left:-2px}
.board__hint kbd{font:600 11px ui-monospace,SFMono-Regular,monospace;border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--ink2)}
</style></head>
<body><div id="app" class="board">
  <div class="board__bar">
    <label class="bsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Find a session by its title…" autocomplete="off" spellcheck="false"><kbd id="qk">/</kbd></label>
    <div class="bfilters" id="filters"></div>
    <span class="board__hint" id="hint"></span>
    <button class="board__add" data-addcol>+ Column</button>
  </div>
  <div class="board__cols" id="colsEl"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bridge = (type, d = {}) => { try { window.webkit.messageHandlers.sessions.postMessage({type, ...d}) } catch (e) {} };
const I = {
  doc: '<svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7zM14 3v4h4"/></svg>',
  pr: '<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-4"/></svg>',
  web: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
  lin: '<svg viewBox="0 0 24 24"><path d="M4 14l6 6M4 9l11 11M6 5l13 13M11 4l9 9"/></svg>',
  wait: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};
const COLORS = ['blue', 'yellow', 'violet', 'pink', 'aqua', 'lime', 'gray'];
const NEEDS = new Set(['permission', 'question', 'review', 'heads_up', 'wrong_login']);
// The sidebar's icons and words for each state (never color alone: an icon and a word).
const ICON = {
  spin: '<path d="M21 12a9 9 0 1 1-6.2-8.56"/>',
  hand: '<path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  q: '<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4"/><path d="M12 17h.01"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  warn: '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  dots: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  pause: '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  term: '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>',
  star: '<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  pin: '<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',
};
const ic = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const LOOK = {
  urgent: ['warn', 'Urgent'], permission: ['hand', 'Approve'], question: ['q', 'Answer'], review: ['eye', 'Look at it'],
  heads_up: ['warn', 'Read this'], wrong_login: ['warn', 'Wrong login'], working: ['spin', 'Working'], reading: ['dots', 'Reading'],
  done: ['check', 'Done'], handled: ['check', 'Handled'], info: ['check', 'Answered'], parked: ['pause', 'Parked'], shell: ['term', 'Terminal'],
};
// The Pinned column: every pinned session, in the sidebar's pin order, by itself.
const PIN = '__pinned';

let rows = [], board = {cols: [], cards: {}, collapsed: []}, nowT = Date.now() / 1000, front = '';
let editing = null;   // {k, what: 'note'|'linear'} or {col}
let cur = null;       // the keyboard's place: {k, col} on a card, {col} on a column's head

window.SB = {
  setData(p, extra){
    rows = (p && p.s) || [];
    if (extra && extra.board && !editing && !dragK && !dragCol){
      board = structuredClone(extra.board);
      for (const c of board.cols) if (!COLORS.includes(c.color)) c.color = c.color === 'purple' ? 'violet' : 'gray';
      if (!board.cols.some(c => c.id === PIN)){ board.cols.unshift({id: PIN, name: 'Pinned', color: 'gray'}); save(); }
    }
    if (extra && extra.now) nowT = extra.now;
    // You went to another session since: the keyboard starts on its card.
    if (extra && 'front' in extra && (extra.front || '') !== front){ front = extra.front || ''; cur = null; }
    rekey();
    if (!editing && !dragK && !dragCol) render();
  }
};
// Where a new session's card goes: the first column that is not Pinned.
const homeCol = () => (board.cols.find(c => c.id !== PIN) || board.cols[0]).id;

// A session whose key changed (its conversation id arrived) keeps its card.
function rekey(){
  let changed = false;
  for (const r of rows){
    if (r.was && board.cards[r.was] && !board.cards[r.k]){ board.cards[r.k] = board.cards[r.was]; delete board.cards[r.was]; changed = true; }
  }
  if (changed) save();
}
const save = () => bridge('board', {board});
const rowOf = k => rows.find(r => r.k === k);

// [filter group, the state's badge]. The badge is the sidebar's: its icon (the spinner while
// the agent works) and its word; a new answer (after you last looked) has the bell.
function stateOf(r){
  const st = (r.u && NEEDS.has(r.st)) ? 'urgent' : (r.st || 'info');
  // [filter group, icon, word, color, spins]
  if (!r.o) return ['off', 'moon', 'Off', '--muted'];
  if (st === 'working' || st === 'reading') return ['work', LOOK[st][0], LOOK[st][1], st === 'working' ? '--work' : '--muted', st === 'working'];
  if (st === 'urgent' || NEEDS.has(st)) return ['needs', LOOK[st][0], LOOK[st][1], '--needs'];
  // (Only once the Mac has a time you last looked at it: before that, nothing counts as new.)
  const fresh = r.a !== 'shell' && r.vs > 0 && r.fa > r.vs && (st === 'done' || st === 'info');
  if (fresh) return ['needs', 'bell', st === 'done' ? 'New: done' : 'New answer', '--needs'];
  const [icon, word] = LOOK[st] || LOOK.info;
  return ['done', icon, word, st === 'done' || st === 'handled' ? '--done' : '--muted'];
}
function ago(t){
  const s = Math.max(0, nowT - t);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  if (s < 172800) return 'yesterday';
  return Math.floor(s / 86400) + ' days ago';
}
function span(s){
  if (s < 3600) return [Math.max(1, Math.floor(s / 60)), 'min'];
  if (s < 86400) return [Math.floor(s / 3600), Math.floor(s / 3600) === 1 ? 'hour' : 'hours'];
  return [Math.floor(s / 86400), Math.floor(s / 86400) === 1 ? 'day' : 'days'];
}

// The sessions on the board: every running one (not the pins), and every one you put on it.
// The pinned ones are all in Pinned, in pin order, also the ones you turned off.
function cardsOf(){
  const out = [];
  const first = homeCol();
  for (const r of rows){
    if (r.ar || r.k.startsWith('conv:')) continue;
    const c = board.cards[r.k];
    if (r.pn != null){ out.push({r, c: {...(c || {}), col: PIN, pos: r.pn, hidden: false}, pinned: true}); continue; }
    if (c && c.hidden) continue;
    if (!c && !(r.o && r.a !== 'shell')) continue;
    out.push({r, c: c && c.col !== PIN && board.cols.some(x => x.id === c.col) ? c : {...(c || {}), col: first, pos: c ? c.pos : null}});
  }
  return out;
}

function linkLabel(r, u){
  const l = (r.lk || []).find(x => x[1] === u);
  if (l && l[2]) return [l[0] === 'doc' ? 'doc' : 'web', l[2]];
  const pr = (r.pr || []).find(p => p.u === u);
  if (pr || /\/pull\/\d+/.test(u)) return ['pr', 'PR #' + (pr ? pr.n : u.match(/\/pull\/(\d+)/)[1])];
  if (/doc\.simplero\.me|\/admin\/docs/.test(u)) return ['doc', 'Doc'];
  try { const x = new URL(u); return ['web', (x.host.split('.')[0] + x.pathname).replace(/\/$/, '').slice(0, 40)]; } catch (e) { return ['web', u.slice(0, 40)]; }
}
function linksOf(r){
  const urls = [];
  if (r.bc && r.bc[1]) urls.push(r.bc[1]);
  for (const t of r.bt || []) if (t.s !== 'done') for (const u of t.l || []) urls.push(u);
  if (!urls.length){ const d = (r.lk || []).find(l => l[0] === 'doc'); if (d) urls.push(d[1]); }
  return [...new Set(urls)].slice(0, 2);
}
function linearLabel(u){
  const m = u.match(/issue\/([A-Z]+-\d+)/) || u.match(/project\/([^/?#]+)/);
  return m ? m[1].replace(/-[0-9a-f]{8,}$/, '').replace(/-/g, ' ').replace(/^(\w+ \d+)$/, s => s.replace(' ', '-')) : 'Linear';
}

function cardHTML({r, c, pinned}, col){
  const [st, icon, word, color, spins] = stateOf(r);
  const title = r.gl || r.t || r.n;
  let next = '';
  // As in the sidebar: the state's word, then what the agent does now (all of it), else what is next.
  if (st === 'work' && r.wl) next = esc(r.wl.replace(/^[^\p{L}\p{N}(]+/u, ''));
  else if (r.bc && r.bc[0]) next = `<b>Check:</b> ${esc(r.bc[0])}`;
  else if (r.ns) next = esc(r.ns);
  else if (r.bn) next = esc(r.bn);
  const chips = linksOf(r).map(u => { const [k, t] = linkLabel(r, u); return `<span class="chip" data-link="${esc(u)}" title="${esc(u)}">${I[k]}${esc(t)}</span>`; });
  for (const w of c.waits || []){ const o = rowOf(w); chips.push(`<span class="chip chip--wait" data-open="${esc(w)}" title="Waits for this session">${I.wait}Waits for ${esc(o ? o.n : 'a closed session')}</span>`); }
  if (c.linear) chips.push(`<span class="chip chip--linear" data-link="${esc(c.linear)}" title="${esc(c.linear)}">${I.lin}${esc(linearLabel(c.linear))}</span>`);
  const meta = [];
  // (While it works, the line above already says so.)
  if (st !== 'work') meta.push(r.o ? 'Updated ' + ago(r.la) : 'Off since ' + ago(r.ca || r.la).replace(' ago', '').replace('yesterday', 'yesterday'));
  const pr = (r.pr || [])[0];
  if (pr) meta.push(pr.s === 'MERGED' ? `PR #${pr.n} merged` : pr.s === 'CLOSED' ? `PR #${pr.n} closed` : pr.ci === 'fail' ? `PR #${pr.n} · CI failed` : pr.ci === 'pending' ? `PR #${pr.n} · CI running` : `PR #${pr.n} · CI passed`);
  if (r.m) meta.push(r.m);
  const slot = r.wt && r.wt.top && r.wt.top.match(/Simplero-(\d+)$/);
  if (slot) meta.push('Slot ' + slot[1]);
  let bubble = '';
  if (col.id !== homeCol() && col.id !== PIN && c.at){
    const [n, unit] = span(nowT - c.at);
    if (nowT - c.at >= 3600) bubble = `<span class="bubble" title="In ${esc(col.name)} for ${n} ${unit}"><span><b>${n}</b><small>${unit}</small></span></span>`;
  }
  let note = c.note ? `<div class="card__note">${esc(c.note)}</div>` : '';
  if (editing && editing.k === r.k && editing.what === 'note')
    note = `<textarea class="note-edit" rows="3" placeholder="A note for yourself">${esc(c.note || '')}</textarea><div class="edit-hint">Return saves · Shift-Return: new line · Esc: cancel</div>`;
  let lin = '';
  if (editing && editing.k === r.k && editing.what === 'linear')
    lin = `<input class="line-edit" placeholder="Paste a Linear issue or project link" value="${esc(c.linear || '')}"><div class="edit-hint">Return saves · empty removes it · Esc: cancel</div>`;
  return `<article class="card ${st === 'off' ? 'card--off' : ''} ${st === 'needs' ? 'needs' : ''}" data-k="${esc(r.k)}" ${pinned ? 'data-pinned' : ''} title="${pinned ? `Click to go to “${esc(r.n)}”. Pinned: it stays in Pinned while it is pinned in the sidebar.` : `Click to go to “${esc(r.n)}”. Drag it to another column.`}">
    <span class="card__ico" style="color:var(${color})">${ic(icon, spins ? 'spin' : '')}</span>
    <div class="card__body">
      <div class="card__tab">${r.pri ? `<svg class="prio" viewBox="0 0 24 24" aria-label="Priority"><title>${c.prio ? 'Priority' : 'Priority: its column is a priority column'}</title>${ICON.star}</svg>` : ''}<span class="nm">${esc(r.n)}</span>${bubble}</div>
      <div class="card__line"><span class="word" style="color:var(${color})">${esc(word)}</span>${next ? ' · ' + next : ''}</div>
      ${title && title !== r.n ? `<h3 class="card__title">${esc(title)}</h3>` : ''}
      ${note}${lin}
      ${chips.length ? `<div class="card__links">${chips.join('')}</div>` : ''}
      ${meta.length ? `<div class="card__meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : ''}
    </div>
    <button class="card__more" data-cardmenu="${esc(r.k)}" title="Note, waits for, Linear, remove" aria-label="More for ${esc(r.n)}">⋯</button>
  </article>`;
}

// Find and filter: words match the card's titles only (the session's name and the line under it);
// the buttons keep only sessions in that state.
const FILTERS = [['all', 'All'], ['needs', '? Needs you'], ['work', '↻ Working'], ['done', '✓ Answered'], ['off', '⏾ Off']];
let filter = 'all', words = [];
try { filter = localStorage.getItem('boardFilter') || 'all'; } catch (e) {}
const filtering = () => filter !== 'all' || words.length > 0;
function matches(x){
  const r = x.r;
  if (filter !== 'all' && stateOf(r)[0] !== filter) return false;
  if (!words.length) return true;
  const hay = [r.n, r.gl || r.t].filter(Boolean).join(' \n ').toLowerCase();
  return words.every(w => hay.includes(w));
}
function render(){
  const all = cardsOf().filter(matches);
  const byCol = Object.fromEntries(board.cols.map(c => [c.id, []]));
  for (const x of all) (byCol[x.c.col] || byCol[homeCol()]).push(x);
  for (const id in byCol) byCol[id].sort((a, b) => (a.c.pos ?? -1e9 + 0) - (b.c.pos ?? -1e9 + 0) || (b.r.la - a.r.la));
  const collapsed = new Set(board.collapsed || []);
  const cols = board.cols.map(col => {
    const list = byCol[col.id], pin = col.id === PIN;
    if (collapsed.has(col.id))
      return `<section class="col col--${esc(col.color)} collapsed" data-col="${esc(col.id)}" style="--n:${list.length}" title="${esc(col.name)}: ${list.length}. Click (or Return) to open it."><div class="col__pill"><b>${list.length}</b><span>${esc(col.name)}</span></div></section>`;
    const nameEdit = editing && editing.col === col.id;
    const empty = pin ? 'Pin a session in the sidebar and it shows here.' : filtering() ? 'No match here.' : 'Drag a session here.';
    return `<section class="col col--${esc(col.color)}" data-col="${esc(col.id)}">
      <div class="col__head" data-colhead="${esc(col.id)}" title="${pin ? 'Your pinned sessions, in the sidebar’s order. Drag to move the column.' : 'Drag to move the column. Double-click the name to rename it.'}">${pin ? `<svg class="col__pin" viewBox="0 0 24 24" aria-hidden="true">${ICON.pin}</svg>` : ''}${col.prio ? `<svg class="prio" viewBox="0 0 24 24" aria-label="Priority column"><title>Priority column: its sessions come first in every list of the sidebar.</title>${ICON.star}</svg>` : ''}<span class="name" ${nameEdit ? 'contenteditable="true"' : ''}>${esc(col.name)}</span><span class="col__count">${list.length}</span><button class="col__more" data-colmenu="${esc(col.id)}" aria-label="Column ${esc(col.name)}">⋯</button></div>
      ${list.length ? list.map(x => cardHTML(x, col)).join('') : `<div class="col__empty">${empty}</div>`}
    </section>`;
  }).join('');
  // Only what changed is drawn again, and every column keeps where you scrolled it to.
  const colsEl = $('#colsEl');
  if (cols !== render.last){
    render.last = cols;
    const tops = Object.fromEntries([...colsEl.querySelectorAll('.col[data-col]')].map(c => [c.dataset.col, c.scrollTop]));
    const left = colsEl.scrollLeft;
    colsEl.innerHTML = cols;
    for (const c of colsEl.querySelectorAll('.col[data-col]')) if (tops[c.dataset.col]) c.scrollTop = tops[c.dataset.col];
    colsEl.scrollLeft = left;
  }
  const total = cardsOf().length;
  const hint = filtering() ? `${all.length} of ${total} sessions` : `${total} session${total === 1 ? '' : 's'}`;
  const keys = '<kbd>↩</kbd> go to it · <kbd>space</kbd> menu · <kbd>⌥</kbd> arrows: move the card · <kbd>tab</kbd> filter · <kbd>esc</kbd> back';
  const hintHTML = `${hint} · ${keys}`;
  if ($('#hint').innerHTML !== hintHTML) $('#hint').innerHTML = hintHTML;
  const fl = FILTERS.map(([id, label]) => `<button class="bf${filter === id ? ' on' : ''}" data-filter="${id}" aria-pressed="${filter === id}" tabindex="-1">${label}</button>`).join('');
  if (fl !== render.lastF){ render.lastF = fl; $('#filters').innerHTML = fl; }
  showCursor(false);
  if (editing){
    const f = editing.col ? $('.col__head .name[contenteditable]') : $('.note-edit, .line-edit');
    if (f && document.activeElement !== f){ f.focus(); if (editing.col){ const r = document.createRange(); r.selectNodeContents(f); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } else if (f.setSelectionRange) f.setSelectionRange(f.value.length, f.value.length); }
  }
}

// MARK: Edits
function setCard(k, f){
  const c = board.cards[k] || {col: homeCol(), pos: null, at: Math.floor(Date.now() / 1000)};
  f(c);
  board.cards[k] = c;
}
function commitEdit(cancel){
  const e = editing; editing = null;
  if (!e || cancel){ render(); return; }
  if (e.col){
    const n = ($('.col__head .name[contenteditable]')?.textContent || '').trim();
    const col = board.cols.find(c => c.id === e.col);
    if (col && n) col.name = n.slice(0, 40);
  } else if (e.what === 'note'){
    const v = ($('.note-edit')?.value || '').trim();
    setCard(e.k, c => { c.note = v; });
  } else if (e.what === 'linear'){
    const v = ($('.line-edit')?.value || '').trim();
    setCard(e.k, c => { c.linear = /^https?:\/\//.test(v) ? v : ''; });
  }
  save(); render();
}

// MARK: Menus
let pop = null;
function closePop(){ if (pop){ pop.remove(); pop = null; } }
function openPop(x, y, html, onClick){
  closePop();
  pop = document.createElement('div');
  pop.className = 'pop';
  pop.innerHTML = html;
  document.body.appendChild(pop);
  const r = pop.getBoundingClientRect();
  pop.style.left = Math.max(6, Math.min(x, innerWidth - r.width - 6)) + 'px';
  pop.style.top = Math.max(6, Math.min(y, innerHeight - r.height - 6)) + 'px';
  pop.addEventListener('click', e => { const b = e.target.closest('button[data-a]'); if (b){ e.stopPropagation(); const a = b.dataset; closePop(); onClick(a); } });
  pop.querySelector('button')?.focus();
}
function cardMenu(k, x, y){
  const r = rowOf(k), c = board.cards[k] || {};
  const others = rows.filter(o => o.k !== k && !o.ar && !o.k.startsWith('conv:') && (o.o || board.cards[o.k]) && o.pn == null).slice(0, 30);
  const waits = new Set(c.waits || []);
  openPop(x, y, `
    <button data-a="note">✎ ${c.note ? 'Edit the note' : 'Add a note'}</button>
    <button data-a="prio"><span class="check">${c.prio ? '✓' : ''}</span>Priority (first in every list)</button>
    <button data-a="linear">${I.lin.replace('<svg', '<svg width="13" height="13" style="stroke:currentColor;fill:none;stroke-width:2"')} ${c.linear ? 'Change the Linear link' : 'Link to Linear'}</button>
    <div class="cap">Waits for</div>
    ${others.length ? others.map(o => `<button data-a="wait" data-k="${esc(o.k)}"><span class="check">${waits.has(o.k) ? '✓' : ''}</span>${esc(o.n)}</button>`).join('') : '<div class="cap" style="text-transform:none;font-weight:500">No other sessions.</div>'}
    ${r && r.pn != null ? '<div class="cap" style="text-transform:none;font-weight:500">Pinned: it stays in Pinned. Unpin it in the sidebar to move it.</div>' : `<div class="cap">Move to</div>
    ${board.cols.filter(col => col.id !== PIN).map(col => `<button data-a="move" data-col="${esc(col.id)}"><span class="check">${(c.col || homeCol()) === col.id ? '✓' : ''}</span>${esc(col.name)}</button>`).join('')}
    <hr><button data-a="hide">Remove from the board</button>`}`,
    a => {
      if (a.a === 'note' || a.a === 'linear'){ editing = {k, what: a.a}; render(); return; }
      if (a.a === 'prio') setCard(k, c => { if (c.prio) delete c.prio; else c.prio = true; });
      if (a.a === 'wait') setCard(k, c => { const s = new Set(c.waits || []); s.has(a.k) ? s.delete(a.k) : s.add(a.k); c.waits = [...s]; });
      if (a.a === 'move') moveCard(k, a.col, null);
      if (a.a === 'hide') setCard(k, c => { c.hidden = true; });
      save(); render();
    });
}
function colMenu(id, x, y){
  const col = board.cols.find(c => c.id === id);
  const pin = id === PIN, others = board.cols.filter(c => c.id !== id && c.id !== PIN);
  openPop(x, y, `
    ${pin ? '<div class="cap" style="text-transform:none;font-weight:500">Your pinned sessions. Pin and unpin in the sidebar.</div>' : `<button data-a="rename">Rename</button><button data-a="prio"><span class="check">${col.prio ? '✓' : ''}</span>Priority column (its sessions first in every list)</button>`}
    <div class="sw">${COLORS.map(cl => `<button data-a="color" data-c="${cl}" style="--c:var(--c-${cl})" title="${cl}" aria-label="Color ${cl}">${col.color === cl ? '✓' : ''}</button>`).join('')}</div>
    <button data-a="fold">Fold it</button>
    ${!pin && others.length ? `<hr><button data-a="remove">Remove the column (its cards go to ${esc(others[0].name)})</button>` : ''}`,
    a => {
      if (a.a === 'rename'){ editing = {col: id}; render(); return; }
      if (a.a === 'color') col.color = a.c;
      if (a.a === 'prio'){ if (col.prio) delete col.prio; else col.prio = true; }
      if (a.a === 'fold') board.collapsed = [...new Set([...(board.collapsed || []), id])];
      if (a.a === 'remove'){
        const to = others[0].id;
        for (const k in board.cards) if (board.cards[k].col === id) board.cards[k].col = to;
        board.cols = board.cols.filter(c => c.id !== id);
        board.collapsed = (board.collapsed || []).filter(c => c !== id);
      }
      save(); render();
    });
}

// MARK: Drag and drop
// With the mouse itself (not the browser's drag and drop, which a WebKit view in an app does not
// always start): press, move 5 points, and the card or column follows the pointer. Cards: a
// line shows where it lands. Columns: they change places as you move.
let dragK = null, dragCol = null, press = null, ghost = null, justDragged = false;
function moveCard(k, colId, before){
  const list = cardsOf().filter(x => !x.pinned && (x.c.col || homeCol()) === colId && x.r.k !== k)
    .sort((a, b) => (a.c.pos ?? -1e9) - (b.c.pos ?? -1e9) || (b.r.la - a.r.la));
  const i = before ? list.findIndex(x => x.r.k === before) : list.length;
  const at = i < 0 ? list.length : i;
  list.splice(at, 0, {r: {k}});
  list.forEach((x, n) => setCard(x.r.k, c => { c.pos = n; }));
  setCard(k, c => { if (c.col !== colId) c.at = Math.floor(Date.now() / 1000); c.col = colId; c.hidden = false; });
}
function colAt(x, y){
  const el = document.elementFromPoint(x, y);
  return el && el.closest('.col[data-col]');
}
function cardSpot(x, y){
  const col = colAt(x, y);
  if (!col) return null;
  if (col.dataset.col === PIN) return null;   // Pinned follows the sidebar's pins
  if (col.classList.contains('collapsed')) return {col: col.dataset.col, before: null, el: col};
  const cards = [...col.querySelectorAll('.card[data-k]')].filter(c => c.dataset.k !== dragK);
  const before = cards.find(c => { const b = c.getBoundingClientRect(); return y < b.top + b.height / 2; });
  return {col: col.dataset.col, before: before ? before.dataset.k : null, el: col, beforeEl: before};
}
document.addEventListener('mousedown', e => {
  if (e.button !== 0 || editing || e.target.closest('button, .chip, .pop, [contenteditable="true"], textarea, input')) return;
  const head = e.target.closest('[data-colhead]'), card = !head && e.target.closest('.card[data-k]:not([data-pinned])');
  if (!head && !card) return;
  press = {x: e.clientX, y: e.clientY, head, card, on: false};
});
document.addEventListener('mousemove', e => {
  if (!press) return;
  if (!e.buttons){ endDrag(e, true); return; }
  if (!press.on){
    if (Math.hypot(e.clientX - press.x, e.clientY - press.y) < 5) return;
    press.on = true;
    closePop();
    if (press.head){
      dragCol = press.head.dataset.colhead;
      press.colEl = press.head.closest('.col');
      press.colEl.classList.add('col-dragging');
    } else {
      dragK = press.card.dataset.k;
      const b = press.card.getBoundingClientRect();
      ghost = press.card.cloneNode(true);
      ghost.classList.add('ghost');
      ghost.style.width = b.width + 'px';
      press.dx = press.x - b.left; press.dy = press.y - b.top;
      document.body.appendChild(ghost);
      press.card.classList.add('dragging');
    }
    document.body.classList.add('is-dragging');
  }
  e.preventDefault();
  if (dragCol){
    // The column changes places with the one under the pointer.
    const over = colAt(e.clientX, e.clientY);
    if (over && over !== press.colEl){
      const b = over.getBoundingClientRect();
      if (e.clientX < b.left + b.width / 2) over.before(press.colEl); else over.after(press.colEl);
    }
    autoScroll(e.clientX);
    return;
  }
  ghost.style.left = (e.clientX - press.dx) + 'px';
  ghost.style.top = (e.clientY - press.dy) + 'px';
  document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
  document.querySelectorAll('.drop-line').forEach(x => x.remove());
  ghost.style.display = 'none';
  const s = cardSpot(e.clientX, e.clientY);
  ghost.style.display = '';
  if (s){
    s.el.classList.add('drop-target');
    if (!s.el.classList.contains('collapsed')){
      const line = document.createElement('div'); line.className = 'drop-line';
      if (s.beforeEl) s.beforeEl.before(line); else s.el.appendChild(line);
    }
  }
  autoScroll(e.clientX);
});
function autoScroll(x){
  const cols = document.querySelector('.board__cols'); if (!cols) return;
  const b = cols.getBoundingClientRect();
  if (x < b.left + 40) cols.scrollLeft -= 18; else if (x > b.right - 40) cols.scrollLeft += 18;
}
function endDrag(e, cancel){
  const p = press; press = null;
  if (!p || !p.on){ return; }
  justDragged = true; setTimeout(() => { justDragged = false; }, 0);
  document.body.classList.remove('is-dragging');
  if (dragCol){
    const order = [...document.querySelectorAll('.col[data-col]')].map(c => c.dataset.col);
    if (!cancel) board.cols = order.map(id => board.cols.find(c => c.id === id)).filter(Boolean);
  } else if (dragK){
    if (ghost) ghost.style.display = 'none';
    const s = !cancel && cardSpot(e.clientX, e.clientY);
    if (s) moveCard(dragK, s.col, s.before);
  }
  if (ghost){ ghost.remove(); ghost = null; }
  dragK = dragCol = null;
  if (!cancel) save();
  render.last = null;   // the page moved things itself: draw it all again
  render();
}
document.addEventListener('mouseup', e => endDrag(e, false));
window.addEventListener('blur', () => { if (press && press.on) endDrag({clientX: 0, clientY: 0}, true); press = null; });

// MARK: Clicks and keys
const qEl = $('#q');
qEl.addEventListener('input', () => { words = qEl.value.toLowerCase().split(/\s+/).filter(Boolean); render(); });
qEl.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); if (qEl.value){ qEl.value = ''; words = []; render(); } else qEl.blur(); }
  if (e.key === 'Enter'){ e.preventDefault(); const first = document.querySelector('.card[data-k]'); if (first) bridge('open', {k: first.dataset.k}); }
  if (e.key === 'ArrowDown'){ e.preventDefault(); e.stopPropagation(); qEl.blur(); cur = null; const first = document.querySelector('.card[data-k]'); setCur(first); showCursor(true); }
});
document.addEventListener('click', e => {
  if (justDragged) return;
  const t = e.target;
  const btn = t.closest('button'); if (btn && !btn.closest('.pop')) setTimeout(() => btn.blur(), 0);
  if (pop && !t.closest('.pop')) closePop();
  if (editing && !t.closest('.note-edit, .line-edit, .col__head .name[contenteditable]')){ commitEdit(false); return; }
  const fb = t.closest('[data-filter]');
  if (fb){ filter = fb.dataset.filter; try { localStorage.setItem('boardFilter', filter); } catch (e) {} render(); return; }
  if (t.closest('[data-addcol]')){
    const used = new Set(board.cols.map(c => c.color));
    const id = 'c' + Date.now().toString(36);
    board.cols.push({id, name: 'New column', color: COLORS.find(c => !used.has(c)) || 'gray'});
    editing = {col: id}; save(); render();
    $('.board__cols').scrollLeft = 1e6;
    return;
  }
  const cm = t.closest('[data-colmenu]'); if (cm){ e.stopPropagation(); const r = cm.getBoundingClientRect(); colMenu(cm.dataset.colmenu, r.left, r.bottom + 4); return; }
  const km = t.closest('[data-cardmenu]'); if (km){ e.stopPropagation(); const r = km.getBoundingClientRect(); cardMenu(km.dataset.cardmenu, r.left - 160, r.bottom + 4); return; }
  const coll = t.closest('.col.collapsed[data-col]'); if (coll){ board.collapsed = (board.collapsed || []).filter(c => c !== coll.dataset.col); save(); render(); return; }
  const ln = t.closest('[data-link]'); if (ln){ bridge('link', {url: ln.dataset.link}); return; }
  const op = t.closest('[data-open]'); if (op){ bridge('open', {k: op.dataset.open}); return; }
  if (t.closest('.col__head, .note-edit, .line-edit, .pop')) return;
  const card = t.closest('.card[data-k]'); if (card) bridge('open', {k: card.dataset.k});
});
document.addEventListener('dblclick', e => {
  const h = e.target.closest('[data-colhead]');
  if (h && !editing && h.dataset.colhead !== PIN){ editing = {col: h.dataset.colhead}; render(); }
});
document.addEventListener('contextmenu', e => {
  const card = e.target.closest('.card[data-k]');
  if (card){ e.preventDefault(); cardMenu(card.dataset.k, e.clientX, e.clientY); return; }
  const col = e.target.closest('.col[data-col]:not(.collapsed)');
  if (col){ e.preventDefault(); colMenu(col.dataset.col, e.clientX, e.clientY); }
});
// MARK: Keyboard
// The Board works without the mouse: the arrows move a ring from card to card (and up to a
// column's head), Return goes to the session, Space opens its menu, Option and an arrow moves
// the card (or the column), Tab changes the filter, / finds.
const colEls = () => [...document.querySelectorAll('.col[data-col]')];
const cardEls = col => [...col.querySelectorAll('.card[data-k]')];
function cursorEl(){
  if (!cur) return null;
  if (cur.k) return document.querySelector(`.card[data-k="${CSS.escape(cur.k)}"]`);
  const col = document.querySelector(`.col[data-col="${CSS.escape(cur.col)}"]`);
  return col && (col.classList.contains('collapsed') ? col : col.querySelector('.col__head'));
}
function setCur(el){
  if (!el){ cur = null; return; }
  const col = el.closest('.col[data-col]');
  cur = el.matches('.card') ? {k: el.dataset.k, col: col && col.dataset.col} : {col: col.dataset.col};
}
function showCursor(scroll){
  let el = cursorEl();
  if (!el){
    // Gone (a filter, it closed): the first card of its column, the session you are in, or the first card.
    const col = cur && document.querySelector(`.col[data-col="${CSS.escape(cur.col || '')}"]`);
    const fr = front && rows.find(r => r.sf === front);
    el = (col && (cardEls(col)[0] || col.querySelector('.col__head') || col))
      || (fr && document.querySelector(`.card[data-k="${CSS.escape(fr.k)}"]`))
      || document.querySelector('.card[data-k]') || document.querySelector('.col__head');
    setCur(el);
    scroll = true;
  }
  document.querySelectorAll('.kb').forEach(x => { if (x !== el) x.classList.remove('kb'); });
  if (el && !el.classList.contains('kb')) el.classList.add('kb');
  if (el && scroll) el.scrollIntoView({block: 'nearest', inline: 'nearest'});
}
function stepV(dy){
  const el = cursorEl(); if (!el) return showCursor(true);
  const col = el.closest('.col'), cards = cardEls(col);
  if (el.matches('.card')){
    const i = cards.indexOf(el) + dy;
    setCur(i < 0 ? col.querySelector('.col__head') : cards[Math.min(i, cards.length - 1)]);
  } else if (dy > 0 && cards[0]) setCur(cards[0]);
  showCursor(true);
}
function stepH(dx){
  const el = cursorEl(); if (!el) return showCursor(true);
  const cols = colEls(), col = el.closest('.col'), to = cols[cols.indexOf(col) + dx];
  if (!to) return;
  const cards = cardEls(to);
  if (!el.matches('.card') || to.classList.contains('collapsed') || !cards.length){
    setCur(to.classList.contains('collapsed') ? to : to.querySelector('.col__head'));
  } else {
    // The card at the same height in the next column.
    const b = el.getBoundingClientRect(), y = b.top + b.height / 2;
    setCur(cards.reduce((best, c) => { const r = c.getBoundingClientRect(); const d = Math.abs(r.top + r.height / 2 - y); return d < best[0] ? [d, c] : best; }, [1e9, cards[0]])[1]);
  }
  showCursor(true);
}
// Option and an arrow: the card to the next column (at the same place in it) or up and down in
// its column; on a column's head, the column one place to the left or right.
function moveByKey(key){
  const el = cursorEl(); if (!el) return;
  if (!el.matches('.card')){
    if (key !== 'ArrowLeft' && key !== 'ArrowRight') return;
    const i = board.cols.findIndex(c => c.id === cur.col), j = i + (key === 'ArrowLeft' ? -1 : 1);
    if (i < 0 || j < 0 || j >= board.cols.length) return;
    [board.cols[i], board.cols[j]] = [board.cols[j], board.cols[i]];
    save(); render(); showCursor(true); return;
  }
  if (el.hasAttribute('data-pinned')) return;   // Pinned follows the sidebar's pins
  const col = el.closest('.col'), cards = cardEls(col), i = cards.indexOf(el);
  if (key === 'ArrowUp' || key === 'ArrowDown'){
    const up = key === 'ArrowUp';
    if (up ? i === 0 : i === cards.length - 1) return;
    const before = up ? cards[i - 1] : cards[i + 2];
    moveCard(cur.k, col.dataset.col, before ? before.dataset.k : null);
  } else {
    const cols = colEls(), dx = key === 'ArrowLeft' ? -1 : 1;
    let n = cols.indexOf(col) + dx;
    while (cols[n] && (cols[n].dataset.col === PIN || cols[n].classList.contains('collapsed'))) n += dx;
    if (!cols[n]) return;
    const there = cardEls(cols[n]);
    moveCard(cur.k, cols[n].dataset.col, there[i] ? there[i].dataset.k : null);
    cur.col = cols[n].dataset.col;
  }
  save(); render(); showCursor(true);
}
function activate(space){
  const el = cursorEl(); if (!el) return showCursor(true);
  const b = el.getBoundingClientRect();
  if (el.matches('.card')){
    if (space) cardMenu(cur.k, Math.max(8, b.right - 230), b.top + 30); else bridge('open', {k: cur.k});
    return;
  }
  if (el.matches('.col.collapsed')){ board.collapsed = (board.collapsed || []).filter(c => c !== cur.col); save(); render(); showCursor(true); return; }
  if (space || cur.col === PIN) colMenu(cur.col, b.left + 8, b.bottom + 4);
  else { editing = {col: cur.col}; render(); }
}
function setFilter(id){ filter = id; try { localStorage.setItem('boardFilter', filter); } catch (e) {} render(); showCursor(true); }
const typing = t => t && (t.matches('input, textarea') || t.isContentEditable);

document.addEventListener('keydown', e => {
  // A menu is open: the arrows go from item to item, Return or Space picks one, Esc closes it.
  if (pop){
    if (e.key === 'Escape'){ e.preventDefault(); closePop(); showCursor(false); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Tab'){
      e.preventDefault();
      const bs = [...pop.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
      const d = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey) ? -1 : 1;
      bs[(i + d + bs.length) % bs.length]?.focus();
    }
    return;
  }
  if (e.metaKey || e.ctrlKey) return;
  const inField = typing(e.target);
  // "/" or typing a letter (nothing else has the keyboard): the search box.
  if (!editing && !inField && !e.altKey && (e.key === '/' || /^[\p{L}\p{N}]$/u.test(e.key))){
    qEl.focus(); if (e.key === '/') e.preventDefault(); return;
  }
  if (e.key === 'Escape' && !inField && (qEl.value || filter !== 'all') && !editing){
    qEl.value = ''; words = []; filter = 'all'; try { localStorage.setItem('boardFilter', 'all'); } catch (x) {} render(); return;
  }
  if (e.key === 'Escape'){ if (editing){ commitEdit(true); showCursor(false); return; } if (!inField) bridge('close'); return; }
  if (e.key === 'Enter' && editing && !(editing.what === 'note' && e.shiftKey)){ e.preventDefault(); commitEdit(false); showCursor(false); return; }
  if (editing) return;
  if (e.key === 'Tab'){
    e.preventDefault();
    if (inField) e.target.blur();
    const i = FILTERS.findIndex(f => f[0] === filter);
    setFilter(FILTERS[(i + (e.shiftKey ? -1 : 1) + FILTERS.length) % FILTERS.length][0]);
    return;
  }
  if (inField) return;
  const arrows = {ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1};
  if (arrows[e.key]){
    e.preventDefault();
    if (e.altKey) moveByKey(e.key);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') stepV(e.key === 'ArrowUp' ? -1 : 1);
    else stepH(e.key === 'ArrowLeft' ? -1 : 1);
    return;
  }
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur(); activate(e.key === ' '); return; }
  if (e.key === 'Home' || e.key === 'End'){
    e.preventDefault();
    const el = cursorEl(), col = el && el.closest('.col'), cards = col ? cardEls(col) : [];
    if (cards.length){ setCur(e.key === 'Home' ? cards[0] : cards[cards.length - 1]); showCursor(true); }
  }
});
bridge('ready');
</script>
</body></html>
